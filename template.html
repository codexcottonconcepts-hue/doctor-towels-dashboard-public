  const coll=`<div class="scroll"><table><thead><tr><th>Customer</th><th class="n">Committed</th></tr></thead><tbody>
    ${pipe.map(x=>`<tr><td>${esc(x.k)}</td><td class="n">${tick(x.amt)}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td class="n">${tick(pipe.reduce((a,x)=>a+x.amt,0))}</td></tr>
    </tbody></table></div>`;
  return canvas(cardHtml, `
    <div class="vis v8" data-dashboard-widget="yoy"><h3>Monthly taxable sales &mdash; three years</h3>${vYoyLines(y)}</div>
    <div class="vis v4" data-dashboard-widget="collections"><h3>Committed collections</h3>${collectionsAvailable?coll:'<p class="note">The collections summary has no matching breakdown for these filters.</p>'}</div>
    <div class="vis v6" data-dashboard-widget="yoy"><h3>Month by month &mdash; selected period</h3>${table}</div>
    ${achievement}`,
    `Prior years come from the supplementary workbook; only ${L3} exists in the invoice ledger, so its line stops at the last billed month.`);
}

/* ---------- shell ---------- */
/* Line icons for the rail, one per page, legible on their own when the rail is
   collapsed. D&R-S and D&R-N point south and north. */
const NAV_ICONS={
  home:'<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
  online:'<path d="M3 4h2l2 12h12l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
  saloon:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
  drs:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M8 13l4 4 4-4"/>',
  drn:'<circle cx="12" cy="12" r="9"/><path d="M12 17V7M8 11l4-4 4 4"/>',
  llfo:'<path d="M6 8h12l1 12H5z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  lfo:'<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
  balance:'<path d="M12 4v16M8 20h8M5 7h14"/><path d="M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/>',
  state:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
  store:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  yoy:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
};
function renderNav(){
  document.getElementById('nav').innerHTML=PAGES.filter(p=>p.id!=='online'&&!p.hidden&&(p.id==='home'?(dashboardUsablePage('home')||dashboardUsablePage('online')):dashboardUsablePage(p.id))).map(p=>
    `<button data-p="${p.id==='home'&&!dashboardUsablePage('home')?'online':p.id}" data-label="${esc(p.label)}"${(p.id==='home'?page==='home'||page==='online':p.id===page)?' aria-current="page"':''}><span class="ic">${
      NAV_ICONS[p.id]?`<svg viewBox="0 0 24 24" aria-hidden="true">${NAV_ICONS[p.id]}</svg>`:p.icon}</span><span class="lbl">${esc(p.label)}</span></button>`).join('');
}
function renderSlicers(){
  if(page==='online'){onlineSlicers();return;}
  const years=dashboardCan('filters','fy')&&(DATA.fys||[]).length>1
    ? `<div class="slicer"><label for="sl-fy">Financial year</label>
       <select id="sl-fy">${DATA.fys.map(f=>
         `<option value="${f}"${String(f)===FY?' selected':''}>${esc((DATA.fyLabels||{})[f]||f)}</option>`
       ).join('')}</select></div>` : '';
  const selected=(values,value)=>value==='All'?filterAll(values):!filterAll(values)&&filterMatches(values,value);
  if(isLfoSecondary()){
    const d=lfoPayload(),months=lfoMonths();
    LF.month=filterTrim(LF.month,months);
    LF.distributor=filterTrim(LF.distributor,d.distributors.map(x=>String(x.id)));
    const stores=d.stores.filter(s=>filterMatches(LF.distributor,s.distributorId));
    LF.store=filterTrim(LF.store,stores.map(s=>String(s.id)));
    const defs=[['month','Month',[['All','All'],...months.map(m=>[m,m.replace('-',' ')])]],
      ['distributor',groupWord(),[['All','All'],...d.distributors.map(x=>[String(x.id),lfoDistributorName(x)])]],
      ['store','Branch / retailer',[['All','All'],...stores.map(s=>[String(s.id),lfoStoreLabel(s)+(s.isAggregate?' (aggregate)':'')])]]];
    document.getElementById('slicers').innerHTML=years+defs.filter(([k])=>dashboardCan('filters',({month:'secondaryMonth',distributor:'distributor',store:'branch'})[k])).map(([k,label,options])=>
      `<div class="slicer"><label for="sl-lfo-${k}">${label}</label><select multiple data-multi-filter id="sl-lfo-${k}" data-lfo="${k}">${options.map(([value,name])=>
        `<option value="${esc(value)}"${selected(LF[k],value)?' selected':''}>${esc(name)}</option>`).join('')}</select></div>`).join('');
    document.querySelectorAll('#slicers select[data-lfo]').forEach(s=>s.onchange=()=>{
      LF[s.dataset.lfo]=filterRead(s);render();
    });
    const fySel=document.getElementById('sl-fy');
    if(fySel)fySel.onchange=()=>{setFY(fySel.value);F.month=['All'];LF.month=['All'];render();};
    return;
  }
  const defs=[['month','Month',page==='team'?executiveMonths():MONTHS,m=>page==='team'?m.replace('-',' '):SHORT[m]],
              ['dtt','DT/TT',uniq(DT),x=>x],
              ['exec','Executive',[...new Set([...uniq(EX),...(pageDef().region?channelExecutivePeople({...F,exec:['All']}):[])])],x=>x],
              ['customer','Customer',uniq(12),x=>x],
              ['dist','Distribution',uniq(GP),x=>x],
              ['state','State',uniq(ST),x=>x]];
  for(const [k,,options] of defs){
    for(const value of dashboardScopeOptions(k))if(!options.includes(value))options.push(value);
    F[k]=filterTrim(F[k],options);
  }
  document.getElementById('slicers').innerHTML=years+defs.filter(([k])=>dashboardCan('filters',({dtt:'brand',dist:'sub'})[k]||k)).map(([k,l,opts,f])=>
    `<div class="slicer"><label for="sl-${k}">${l}</label><select multiple data-multi-filter ${k==='customer'?'data-searchable':''} id="sl-${k}" data-k="${k}">${
      ['All',...opts].map(o=>`<option value="${esc(o)}"${selected(F[k],o)?' selected':''}>${esc(o==='All'?'All':f(o))}</option>`).join('')}</select></div>`).join('');
  document.querySelectorAll('#slicers select[data-k]').forEach(s=>
    s.onchange=()=>{F[s.dataset.k]=filterRead(s);render();
      if(page==='team')window.history.replaceState(null,'',executiveDetailUrl(F.exec));});
  const fySel=document.getElementById('sl-fy');
  if(fySel) fySel.onchange=()=>{
    setFY(fySel.value);F.month=['All'];LF.month=['All'];render();
    if(page==='team')window.history.replaceState(null,'',executiveDetailUrl(F.exec));};
}
function render(){
  if(typeof resetOnlineCharts==='function')resetOnlineCharts();
  lfoChartObserver?.disconnect();lfoChartObserver=null;lfoChartSpecs=[];
  dashboardMonthObserver?.disconnect();dashboardMonthObserver=null;
  balanceChartObserver?.disconnect();balanceChartObserver=null;
  if(!dashboardNormalizeLocation()){
    document.getElementById('ptitle').textContent='Dashboard';document.getElementById('slicers').innerHTML='';
    document.getElementById('views').innerHTML='';document.getElementById('views').hidden=true;
    document.getElementById('page').innerHTML=dashboardEmpty();renderNav();return;
  }
  const d=pageDef();
  renderSlicers();
  const ms=shortSel();
  const secondary=isLfoSecondary();
  const sub = page==='online'?'Daily, Monday–Sunday weeks and calendar months':isPlannedFY()&&page!=='team'&&!secondary?`Planned year ${esc(fyName())} &middot; no sales yet`:page==='team'?`${esc(filterLabel(F.exec,'All executives'))} &middot; ${filterAll(F.month)?'Full year '+esc(fyName()):esc(filterValues(F.month).map(m=>m.replace('-',' ')).join(', '))}`:secondary?`Secondary sales &middot; ${filterAll(LF.month)?'Full year '+esc(fyName()):esc(filterValues(LF.month).map(m=>m.replace('-',' ')).join(', '))}`:
    `Full year ${esc(fyName())} &middot; ${esc(primaryPeriod())}`;
  document.getElementById('ptitle').innerHTML=esc(d.id==='online'?'Dashboard':d.title)+`<span class="u">${sub}</span>`;
  document.body.classList.add('fit');
  const vw=document.getElementById('views');
  const dashboardTabs=d.id==='home'||d.id==='online';
  const hasViews=dashboardTabs||!!d.region;
  vw.hidden = !hasViews;
  /* Target Balance has no views; its chip opens the Target planner for this year. */
  const planLink=d.id==='balance'&&window.TARGETS_VIEW===true;
  if(planLink)vw.hidden=false;
  const viewOptions=[...(dashboardTabs&&!dashboardUsablePage('home')?[]:[['overview','Overview'],['detail','Detail']]).filter(([key])=>dashboardCan('views',key)),...(SECONDARY[page]&&dashboardCan('views','secondary')?[['secondary','Secondary']]:[]),...(dashboardTabs&&dashboardUsablePage('online')?[['online','Online Sales']]:[])];
  vw.innerHTML = hasViews ? viewOptions.map(([k,l])=>
    `<button data-v="${k}" aria-current="${page==='online'?k==='online':dashboardView()===k}">${l}</button>`).join('')
    : planLink ? `<a class="plan-link" href="${esc(plannerUrl())}">${window.TARGETS_EDIT===true?'Plan '+esc(planFYName())+' targets':esc(planFYName())+' target plan'} &rarr;</a>` : '';
  const el=document.getElementById('page');
  el.innerHTML = dashboardMarkup(d.id==='home'?pgHome() : d.id==='online'?pgOnline() : d.id==='team'?pgExecutiveDetails() : d.id==='state'?pgState()
               : d.id==='store'?pgStore() : d.id==='map'?pgMap()
               : d.id==='yoy'?pgYoy()
               : d.id==='balance'?pgBalance() : secondary?pgLfoSecondary() : pgDash());
  dashboardFitAccess();
  if(typeof fitOnlineCharts==='function')fitOnlineCharts();
  fitDashboardMonthChart();
  fitBalanceCharts();
  renderNav();
  if(secondary)fitLfoCharts();
  fitTeamNames();
}
document.getElementById('views').addEventListener('click',e=>{
  const b=e.target.closest('[data-v]'); if(!b)return;
  if((page==='home'||page==='online')&&b.dataset.v==='online'){
    if(!dashboardUsablePage('online'))return;page='online';render();return;
  }
  if(page==='online'){
    if(!dashboardUsablePage('home')||!dashboardViews('home').includes(b.dataset.v))return;
    page='home';homeView=b.dataset.v;render();return;
  }
  if(!dashboardViews().includes(b.dataset.v))return;
  if(page==='home')homeView=b.dataset.v;
  else if(pageDef().region)channelViews[page]=b.dataset.v;
  render();
});
document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b)return;
  const nextPage=b.dataset.p;if(!dashboardUsablePage(nextPage))return;
  if(nextPage==='team'){
    if(page!=='team'){executiveReturn=[...filterValues(F.exec)];resetExecutiveTable();}
    window.history.replaceState(null,'',executiveDetailUrl(F.exec));
  }else if(page==='team')window.history.replaceState(null,'','/');
  page=nextPage; render(); window.scrollTo({top:0,behavior:'instant'});
  if(narrowMenu.matches)setMenu(false);   // the drawer closes once a page is chosen
});
/* ☰ menu. Wide screens: the ☰ at the top of the rail collapses it to icons and
   back, remembered on this browser. Narrow screens: the ☰ in the header opens
   the rail as a drawer; a page choice, a tap outside, the rail's ☰ or Escape
   closes it. */
const narrowMenu=window.matchMedia('(max-width:820px)');
const menuShown=()=>narrowMenu.matches?document.body.classList.contains('rail-open'):!document.body.classList.contains('rail-collapsed');
function syncMenuToggle(){
  const shown=menuShown(),narrow=narrowMenu.matches;
  const label=narrow?(shown?'Close menu':'Open menu'):(shown?'Collapse menu':'Expand menu');
  for(const toggle of document.querySelectorAll('.menu-toggle')){
    toggle.setAttribute('aria-expanded',String(shown));toggle.setAttribute('aria-label',label);toggle.title=label;
  }
  // Collapsed, the status dot names the database connection on hover.
  const foot=document.getElementById('railfoot');
  if(foot)foot.title=!narrow&&!shown?[...foot.querySelectorAll('b,#srcinfo,.sales-sync-info')]
    .map(e=>e.textContent.replace(/\s+/g,' ').trim()).filter(Boolean).join(' · '):'';
}
function setMenu(show){
  if(narrowMenu.matches){
    document.body.classList.toggle('rail-open',show);
    if(show)(document.querySelector('#nav [aria-current="page"]')||document.querySelector('#nav button'))?.focus();
    else if(document.getElementById('rail').contains(document.activeElement))document.getElementById('menu-open').focus();
  }else{
    document.body.classList.toggle('rail-collapsed',!show);
    try{localStorage.setItem('dt.menuCollapsed',show?'0':'1');}catch(e){}
  }
  syncMenuToggle();
}
for(const toggle of document.querySelectorAll('.menu-toggle'))toggle.addEventListener('click',()=>setMenu(!menuShown()));
narrowMenu.addEventListener('change',()=>{document.body.classList.remove('rail-open');syncMenuToggle();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('rail-open')){setMenu(false);document.getElementById('menu-open').focus();}
});
document.addEventListener('click',e=>{
  if(document.body.classList.contains('rail-open')&&!e.target.closest('#rail,.menu-toggle'))setMenu(false);
});
syncMenuToggle();
/* Anything carrying data-goto is a shortcut into another page. Delegated from
   the page container because the charts are re-rendered on every filter change,
   so a listener bound to the shapes themselves would not survive. */
document.getElementById('page').addEventListener('click',e=>{
  const achieved=e.target.closest('[data-secondary-breakdown]');
  if(achieved){openSecondaryBreakdown(achieved);return;}
  const distributor=e.target.closest('[data-lfo-distributor]');
  if(distributor){openLfoDistributor(distributor.dataset.lfoDistributor);return;}
  const t=e.target.closest('[data-goto]'); if(!t||!dashboardUsablePage(t.dataset.goto))return;
  if(page==='team')window.history.replaceState(null,'','/');
  page=t.dataset.goto; render(); window.scrollTo({top:0,behavior:'instant'});
});
document.getElementById('page').addEventListener('keydown',e=>{
  const achieved=e.target.closest('[data-secondary-breakdown]');
  if(achieved&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openSecondaryBreakdown(achieved);}
});
document.getElementById('page').addEventListener('input',e=>{
  if(e.target.id!=='executive-customer-search'||!dashboardCan('filters','customer'))return;
  executiveSearch=e.target.value;
  refreshExecutiveTable();
});
/* The Sales team tables' Channel / City / State lists: each choice narrows the
   others, so the lists and the table are redrawn together. The search box is
   outside both and keeps its focus and text. */
document.getElementById('page').addEventListener('change',e=>{
  if(e.target.id==='channel-monthly-executive'){
    if(!dashboardCan('filters','exec'))return;
    channelExecutiveSelection[page]=e.target.value;render();return;
  }
  const key=e.target.dataset?.executiveFilter; if(!key)return;
  if(!dashboardCan('filters',({state:'state',channel:'sub',city:'state'})[key]||key))return;
  executiveFilter[key]=filterRead(e.target);
  refreshExecutiveCustomers();
  document.getElementById('executive-filter-'+key)?.focus();
});
document.getElementById('page').addEventListener('click',e=>{
  const comparison=e.target.closest('[data-channel-comparison]');
  if(comparison){if(!dashboardCan('widgets',comparison.dataset.channelComparison==='executives'?'executive_sales':'retailer_sales'))return;channelComparisonViews[page]=comparison.dataset.channelComparison;render();return;}
  if(!e.target.closest('[data-executive-clear]'))return;
  resetExecutiveTable();
  const input=document.getElementById('executive-customer-search'); if(input)input.value='';
  refreshExecutiveCustomers();
});
document.getElementById('lastup').textContent=DATA.fetched||'';

/* Swap the lettermark for the real logo when refresh.py found a logo.png to
   inline. Kept conditional so the page still brands itself if the file is
   missing, rather than showing a broken image. */
if(DATA.logo){
  const b=document.querySelector('.brand'), mk=b&&b.querySelector('.mk');
  if(mk){ b.classList.add('has-logo'); mk.innerHTML=`<img src="${DATA.logo}" alt="">`; }
  const hmark=document.getElementById('hmark');   // the header tile shown while the rail is hidden
  if(hmark){ hmark.classList.add('has-logo'); hmark.innerHTML=`<img src="${DATA.logo}" alt="">`; }
}
if(DATA.wordmark){                                  // the full logo across the open rail
  const b=document.querySelector('.brand'), img=b&&b.querySelector('.wordmark');
  if(img){ img.src=DATA.wordmark; b.classList.add('has-wordmark'); }
}
(function(){const e=document.getElementById('srcinfo'); if(!e)return;
  e.textContent='Database connected';
  e.title='Dashboard data is read from PostgreSQL';})();
/*__ONLINE_SALES__*/
initLfoLocation();initExecutiveLocation();initAchievementLocation();initOnlineLocation();render();
</script>
