<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Towels</title>
<!--__FAVICON__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">

<style>
/* Deliberate single-theme design: this report reproduces a light Power BI
   canvas, so every colour is painted explicitly and no theme swap applies. */
/* Red / black / white theme, taken from the logo. This dresses the CHROME only
   -- sidebar, headings, buttons, links, focus rings, tooltips. Every chart keeps
   the report's own palette, because three colours cannot tell five channels
   apart and recolouring the data to match a brand costs more than it buys. */
:root{
  --page:#f6f6f7;        /* canvas behind the report */
  --card:#ffffff;        /* visual containers */
  --edge:#e4e4e7;
  --ink:#111112;         /* near-black: text and the darkest data step */
  --ink-2:#3f3f46;
  --muted:#8a8a93;
  --navy:#101012;        /* sidebar -- black, matching the logo plate */
  --navy-2:#26262b;
  --brand:#c8102e;       /* the red from the logo cross */
  /* Data semantics keep their defaults, like the charts -- the theme dresses
     the chrome, not the figures. */
  --up:#16a34a;
  --down:#dc2626;
  --shadow:0 1px 2px rgba(17,17,18,.06), 0 6px 18px -12px rgba(17,17,18,.30);
}
/* The red ramp, light -> dark. Ordinal use only: shares, bands, the map. */
:root{
  --r1:#fbdfe3; --r2:#f4a9b3; --r3:#e5697b; --r4:#c8102e; --r5:#8d0b20; --r6:#5a0715;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"Segoe UI",Archivo,system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.app{display:flex; min-height:100vh; align-items:stretch}

/* ---------- left rail ---------- */
.rail{
  width:214px; flex:0 0 214px; background:#101012; padding:14px 12px 18px;
  display:flex; flex-direction:column; gap:4px;
}
.brand{
  background:#fff; border-radius:10px; padding:11px 12px; margin-bottom:14px;
  display:flex; align-items:center; gap:9px;
}
/* The logo takes the place of the lettermark in the square tile; the wordmark
   beside it carries the name, so the tile only has to hold the spiral. Black
   behind it to match the artwork's own background, and `contain` so the mark is
   never cropped -- both mean any letterboxing is black on black and invisible. */
.brand.has-logo .mk{background:#000; padding:0; overflow:hidden}
.brand.has-logo .mk img{display:block; width:100%; height:100%; object-fit:contain}
.brand .mk{
  width:30px; height:30px; flex:0 0 30px; border-radius:7px; background:#c8102e;
  color:#fff; font-family:Archivo,sans-serif; font-weight:700; font-size:16px;
  display:flex; align-items:center; justify-content:center; letter-spacing:-.03em;
}
.brand .w{font-family:Archivo,sans-serif; font-weight:700; font-size:14px; color:#101012; letter-spacing:-.02em; line-height:1.05; text-transform:uppercase}
/* With logo-wordmark.png the full logo sits on the rail itself, no white card.
   The spiral tile and name stay in the markup for the collapsed rail and for
   a page without the file. */
.brand .wordmark{display:none}
.brand.has-wordmark{background:transparent; padding:2px 6px 0; margin-bottom:12px}
.brand.has-wordmark .wordmark{display:block; width:100%; height:auto}
.brand.has-wordmark>:not(.wordmark){display:none}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  font:inherit; font-weight:500; font-size:13px; cursor:pointer;
  padding:9px 12px; border-radius:8px; border:0;
  background:transparent; color:#a8a8b0;
}
.nav button:hover{background:#26262b; color:#fff}
.nav button[aria-current="page"]{background:#c8102e; color:#fff; font-weight:600}
.nav button:focus-visible{outline:2px solid #e5697b; outline-offset:1px}
.nav .ic{width:18px; flex:0 0 18px; display:flex; align-items:center; justify-content:center; opacity:.95}
.nav .ic svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.railfoot{
  margin-top:auto; padding-top:14px; border-top:1px solid #2e2e34;
  display:flex; align-items:center; gap:9px; color:#a8a8b0; font-size:11.5px; line-height:1.35;
}
.railfoot .av{
  width:30px; height:30px; flex:0 0 30px; border-radius:50%; background:#c8102e;
  display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;
}
.railfoot b{display:block; color:#fff; font-size:12px; font-weight:600}

/* ---------- menu: ☰ collapses the rail to an icon strip ----------
   ☰ sits at the top of the rail and stays in the same place open or collapsed.
   Collapsed, the rail keeps the logo, the page icons (names on hover) and the
   status dot, and the report takes the width at once: no slide, so the charts
   redraw once instead of on every animation frame. The choice is remembered on
   this browser. Below 820px the rail is a drawer, opened by the ☰ in the header. */
.rail{position:relative; z-index:20}
.rail-top{display:flex; align-items:center; margin:-2px 0 8px 2px}
.menu-toggle{
  flex:0 0 auto; width:36px; height:36px; padding:0; border:0; border-radius:8px;
  display:inline-flex; align-items:center; justify-content:center;
  background:transparent; color:#c9c9d1; cursor:pointer;
}
.menu-toggle:hover{background:#26262b; color:#fff}
.menu-toggle:focus-visible{outline:2px solid #e5697b; outline-offset:1px}
.menu-toggle svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round}
.menu-open,.hmark{display:none}   /* the header's ☰ and logo: phones only */
.menu-open{margin:0 -4px 0 -8px; color:var(--ink-2)}
.menu-open:hover{background:#f1f1f3; color:var(--brand)}
.hmark{
  width:30px; height:30px; flex:0 0 30px; border-radius:7px; background:#c8102e;
  color:#fff; font-family:Archivo,sans-serif; font-weight:700; font-size:16px;
  align-items:center; justify-content:center; letter-spacing:-.03em;
}
.hmark.has-logo{background:#000; overflow:hidden}
.hmark img{display:block; width:100%; height:100%; object-fit:contain}
@media (min-width:821px){
  body.rail-collapsed .rail{width:64px; flex-basis:64px; padding:14px 10px 18px}
  body.rail-collapsed .rail-top{margin-left:4px}
  body.rail-collapsed .brand{padding:6px; justify-content:center}
  body.rail-collapsed .brand.has-wordmark{padding:6px 0}
  body.rail-collapsed .brand.has-wordmark .wordmark{display:none}
  body.rail-collapsed .brand.has-wordmark .mk{display:flex}
  body.rail-collapsed .brand .w,body.rail-collapsed .nav .lbl,body.rail-collapsed .railfoot>div{
    position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
  body.rail-collapsed .nav button{justify-content:center; padding:10px 0; position:relative}
  body.rail-collapsed .railfoot{justify-content:center}
  /* Page names appear beside the icon on hover or keyboard focus. */
  body.rail-collapsed .nav button::after{
    content:attr(data-label); position:absolute; left:calc(100% + 12px); top:50%; transform:translateY(-50%);
    background:#101012; color:#fff; font-size:12px; font-weight:600; line-height:1; padding:7px 10px;
    border-radius:6px; white-space:nowrap; box-shadow:0 6px 18px rgba(17,17,18,.28);
    opacity:0; pointer-events:none; transition:opacity .12s; z-index:40}
  body.rail-collapsed .nav button:hover::after,body.rail-collapsed .nav button:focus-visible::after{opacity:1}
}

/* ---------- report surface ---------- */
.report{flex:1 1 auto; padding:0 0 10px; min-width:0}
.rhead{
  background:#fff; border-bottom:1px solid var(--edge); padding:8px 18px 7px;
  display:flex; flex-wrap:wrap; align-items:center; gap:7px 14px;
}
.rhead h1{
  font-family:Archivo,"Segoe UI",sans-serif; font-weight:700; font-size:clamp(15px,1.4vw,19px);
  margin:0; color:#c8102e; letter-spacing:.01em; line-height:1.15; text-transform:uppercase;
}
.rhead h1 .u{display:block; font-size:11.5px; font-weight:400; color:var(--muted);
  letter-spacing:0; text-transform:none; margin-top:2px}
.slicers{margin-left:auto; display:flex; flex-wrap:wrap; gap:9px}
body .slicers .slicer:has(.dt-select){width:clamp(92px,7.8vw,130px);min-width:0;max-width:150px}
.state-drilldown{cursor:pointer}
.state-drilldown:focus-visible path{stroke:#c8102e;stroke-width:2;outline:none}
.products-panel .scroll{min-height:0;flex:1;overflow:auto}
.product-coverage{font-size:10px;color:var(--muted);margin:0 0 6px}
.colour-details{font-size:11px;max-height:45%;overflow:auto;margin-top:8px}
.colour-details summary{cursor:pointer;color:var(--ink-2);font-weight:600}
.retailer-view-tabs{display:flex;gap:5px;margin-bottom:7px;flex-shrink:0}
.retailer-view-tabs button{font-family:inherit;font-size:11px;font-weight:600;border:1px solid #dbe3ee;border-radius:5px;background:#f6f8fc;color:var(--ink-2);padding:4px 9px;cursor:pointer}
.retailer-view-tabs button[aria-pressed=true]{background:#fff2f4;color:var(--brand);border-color:#df96a3}
.retailer-view-tabs button:focus-visible{outline:2px solid var(--brand)}
.slicer{
  display:flex; flex-direction:column; gap:0; min-width:112px;
  border:1px solid #dbe3ee; border-radius:7px; padding:2px 8px 2px; background:#fff;
}
.slicer label{font-size:10px; color:var(--muted); font-weight:500}
.slicer select{
  font:inherit; font-size:12.5px; font-weight:600; padding:0; border:0; outline:0;
  background:transparent; color:var(--ink); cursor:pointer; width:100%;
}
.slicer select:focus-visible{outline:2px solid #e5697b; outline-offset:2px; border-radius:2px}
/* "Data as on" sits under the page subtitle, so the header stays one row. */
.ttl{min-width:0}
.asof{font-size:10px; color:var(--muted); line-height:1.3; margin-top:2px}
.asof b{color:var(--ink-2); font-weight:600}
.tv-current-date,.tv-live-status{display:none}
/* Up to 1440px the filter boxes tighten a little, so the title, views and
   filters share one row even with the menu shown. */
@media (max-width:1440px){
  .slicers{gap:7px}   /* body raises these above dropdown_ui.css, which loads later */
  body .slicers .slicer:has(.dt-select){min-width:104px}
  body .slicers .dt-select .dt-select-trigger{padding:8px 9px; gap:7px}
}
/* Build credit, bottom-right of the report. In the page flow, not fixed: fixed
   floated it over the footnote line and read as a collision. Its own row under
   everything else, so it can never overlap. */
.cred{flex:0 0 auto; text-align:right; padding:2px 16px 8px;
  font-size:9.5px; line-height:1.3; color:var(--muted)}
.cred b{color:var(--ink-2); font-weight:600}
.body{padding:7px 16px 0}

/* ---------- KPI cards ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:9px; margin-bottom:9px}
.kcard{
  background:var(--card); border:1px solid var(--edge); border-radius:10px;
  padding:8px 12px 7px; box-shadow:var(--shadow);
}
.ktop{display:flex; align-items:center; gap:9px}
.kic{
  width:32px; height:32px; flex:0 0 32px; border-radius:50%; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  background:#eef3fb; color:var(--c);
  background:color-mix(in srgb, var(--c) 13%, #fff);
}
.kcard .lab{font-size:11.5px; font-weight:600; color:var(--ink-2); line-height:1.25}
.kcard .val{font-size:22px; font-weight:700; color:var(--ink); margin-top:5px; letter-spacing:-.02em; line-height:1.05}
.kfoot{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-top:5px; padding-top:4px; border-top:1px solid #ececef;
  font-size:11px; color:var(--muted);
}
.kfoot .d{font-weight:700; font-variant-numeric:tabular-nums}
.kfoot .d.up{color:var(--up)} .kfoot .d.down{color:var(--down)}

/* ---------- canvas mode: the Dashboard page is a fixed screen, not a scroll ----------
   The report fills exactly one viewport. Two grid rows share whatever height is
   left after the header and the KPI strip, every panel stretches to its cell, and
   the visual inside scales to the panel. Nothing is transform-scaled and no type
   is shrunk — the panel count per screen is what adapts, via the view chips.   */
body.fit{overflow:hidden}
body.fit .app{height:100vh}
body.fit .report{display:flex; flex-direction:column; height:100vh; min-height:0; padding:0}
body.fit .rhead{flex:0 0 auto}
body.fit .body{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; padding:10px 16px 12px}
body.fit .canvas{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:9px}
body.fit .cards{flex:0 0 auto; margin-bottom:0; grid-template-columns:repeat(7,1fr)}
@media (max-width:1240px){body.fit .cards{grid-template-columns:repeat(4,1fr)}}
/* A card strip of 6 or 4 cards spans the full width instead of leaving empty
   columns of the 7-column grid. */
body.fit .cards:not(.k6):has(>.kcard:nth-child(6):last-child){grid-template-columns:repeat(6,minmax(0,1fr))}
body.fit .cards:not(.k6):has(>.kcard:nth-child(4):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1240px){body.fit .cards:not(.k6):has(>.kcard:nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){body.fit .cards:not(.k6):has(>.kcard:nth-child(6):last-child),
  body.fit .cards:not(.k6):has(>.kcard:nth-child(4):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}}
body.fit .vgrid{flex:1 1 auto; min-height:0; grid-auto-rows:minmax(0,1fr); align-items:stretch}
body.fit .vis{min-height:0; display:flex; flex-direction:column; overflow:hidden}
body.fit .vis > *:not(h3){min-height:0}
body.fit .vis .fill{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center}
body.fit .vis svg{height:100%; width:100%; flex:1 1 auto; min-height:0}
body.fit .scroll{flex:1 1 auto; min-height:0; overflow:auto}
body.fit .foot{flex:0 0 auto; margin:0}

/* view chips beside the page title */
.views{display:flex; gap:4px; background:#ececef; border-radius:8px; padding:3px}
.views button{
  font:inherit; font-size:11.5px; font-weight:600; cursor:pointer; border:0; border-radius:6px;
  padding:5px 13px; background:transparent; color:var(--ink-2);
}
.views button[aria-current="true"]{background:#fff; color:var(--brand); box-shadow:0 1px 2px rgba(15,42,82,.12)}
.views button:focus-visible{outline:2px solid #e5697b; outline-offset:1px}
.views .plan-link{font-size:11.5px; font-weight:700; padding:5px 13px; border-radius:6px; background:#fff; color:var(--brand);
  text-decoration:none; white-space:nowrap; box-shadow:0 1px 2px rgba(15,42,82,.12)}
.views .plan-link:hover{background:#fff0f3}
.views .plan-link:focus-visible{outline:2px solid #e5697b; outline-offset:1px}

/* comfortable typography — this is a fitted canvas, not a shrunken page */
body.fit .kcard{padding:8px 11px 7px}
body.fit .kcard .lab{font-size:11px; line-height:1.25}
body.fit .kcard .val{font-size:21px; margin-top:4px}
body.fit .kic{width:26px; height:26px; flex:0 0 26px; font-size:13px}
body.fit .kfoot{font-size:10px; margin-top:5px; padding-top:4px}
body.fit .vis{padding:9px 12px 9px}
body.fit .vis h3{font-size:10.5px; margin:0 0 6px}
body.fit table{font-size:11.5px}
body.fit th{font-size:9.5px; padding:0 8px 5px 0}
body.fit td{padding:4px 8px 4px 0}
body.fit td,body.fit th{white-space:nowrap}
body.fit td:first-child{white-space:normal}
body.fit .note{font-size:10px; margin:5px 0 0}
body.fit .leg{font-size:10.5px; margin-bottom:3px}
body.fit .dwrap{flex:1 1 auto; min-height:0; flex-direction:column;
  flex-wrap:nowrap; align-items:center; justify-content:center; gap:7px}
body.fit .dwrap svg{flex:0 1 auto; min-height:0; max-height:58%; width:auto; max-width:74%}
body.fit .dlegend{font-size:11px; flex:0 1 auto; width:100%; min-height:0; overflow:auto}
body.fit .dlegend li{padding:3px 0; gap:6px; white-space:nowrap}
body.fit .dlegend b{font-size:11px}
body.fit .dlegend em{font-size:10px; min-width:30px}
body.fit .gauge{max-width:none; width:100%; flex:1 1 auto; min-height:0; display:flex}
body.fit .mapmini{flex:1 1 auto; min-height:0; gap:8px}
body.fit .mapsvg.mini{max-height:none}
body.fit .mlegv{flex:0 0 92px; font-size:10px}
body.fit .mlegv li{padding:2px 0}
body.fit .bul{height:6px}
body.fit .alist{flex:1 1 auto; min-height:0; overflow:auto}
body.fit .alist li{padding:6px 0; gap:8px}
body.fit .alist b{font-size:11.5px}
body.fit .alist em{font-size:10.5px}
body.fit .foot{font-size:10px}
.report{overflow-x:hidden}

/* ---------- visuals ---------- */
.vgrid{display:grid; grid-template-columns:repeat(12,1fr); gap:10px; align-items:start}
.vis{background:var(--card); border:1px solid var(--edge); border-radius:10px;
  padding:9px 12px 8px; min-width:0; box-shadow:var(--shadow)}
.vis h3{margin:0 0 6px; font-size:12px; font-weight:700; color:var(--ink-2);
  letter-spacing:.06em; text-transform:uppercase}
.v3{grid-column:span 3} .v4{grid-column:span 4} .v5{grid-column:span 5}
.v6{grid-column:span 6} .v7{grid-column:span 7} .v8{grid-column:span 8} .v12{grid-column:span 12}
@media (max-width:1080px){.v3,.v4,.v5,.v6,.v7,.v8{grid-column:span 12}}
@media (max-width:820px){
  .app{flex-direction:column}
  .rhead{padding:12px 14px 9px}.body{padding:12px 14px 0}
  /* The rail becomes a drawer over the report, closed until ☰ opens it. */
  .rail{position:fixed; top:0; bottom:0; left:0; z-index:130; width:250px;
    overflow-y:auto; transform:translateX(-100%); visibility:hidden;
    transition:transform .22s ease, visibility .22s; box-shadow:0 0 40px rgba(0,0,0,.35)}
  body.rail-open .rail{transform:none; visibility:visible; transition:transform .22s ease, visibility 0s}
  body.rail-open::after{content:""; position:fixed; inset:0; z-index:125; background:rgba(16,16,18,.42)}
  .menu-open{display:inline-flex}
  .hmark{display:flex}
}

svg{display:block; width:100%; height:auto; overflow:visible}
.grid-l{stroke:#eef2f8; stroke-width:1}
.axis-l{stroke:#d7dfeb; stroke-width:1}
/* Chart text is larger and bolder than body text so values and names read at a glance. */
.tk{fill:#5f6f86; font-size:12.5px; font-family:"IBM Plex Mono",monospace; font-weight:600}
.dl{fill:#1e293b; font-size:12.5px; font-family:"IBM Plex Mono",monospace; font-weight:700}
.cl{fill:#334155; font-size:13px; font-weight:700}
.hit{fill:transparent; cursor:pointer}
.leg{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-bottom:4px}
.leg span{display:inline-flex; align-items:center; gap:5px}
.sw{width:9px; height:9px; border-radius:50%; display:inline-block}

/* Grouped vertical columns share a scale. */
.comparison-chart{display:flex; flex-direction:column; flex:1 1 auto; min-height:0}
.comparison-chart > .leg{flex:0 0 auto}
.comparison-list{flex:1 1 auto; min-height:0; overflow-x:auto; overflow-y:hidden}
.comparison-list:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
.comparison-columns{display:flex; min-width:100%; height:100%; padding:24px 2px 2px}
.comparison-column{display:grid; grid-template-rows:minmax(0,1fr) 34px 16px;
  flex:1 0 82px; min-width:82px; padding:0 5px; border:0;
  background:transparent; color:var(--ink-2); font:inherit; text-align:center}
button.comparison-column{cursor:pointer}
button.comparison-column:hover{background:#f6f8fc}
button.comparison-column:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
a.comparison-column{cursor:pointer;text-decoration:none}
a.comparison-column:hover{background:#f6f8fc}
a.comparison-column:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.team-heading{color:inherit;text-decoration:none}.team-heading:hover{color:var(--brand);text-decoration:underline}
.team-breakup-actions{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;flex-shrink:0}
.team-breakup-actions a{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid #dbe3ee;border-radius:6px;background:#f6f8fc;color:var(--ink);font-size:11px;font-weight:700;text-decoration:none}
.team-breakup-actions a:hover{border-color:var(--brand);color:var(--brand);background:#fff}
.team-breakup-actions a:focus-visible,.executive-drilldown:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.team-breakup-actions small{font-size:10px;font-weight:400;color:var(--muted)}
.executive-drilldown{cursor:pointer;text-decoration:none}
.executive-drilldown:hover{filter:brightness(1.1)}
.comparison-pair{display:grid; grid-template-columns:repeat(2,minmax(0,28px));
  grid-template-rows:minmax(0,1fr); align-items:end; justify-content:center;
  gap:8px; min-height:0; border-bottom:1px solid #cfd8e6;
  background:repeating-linear-gradient(to top,#edf1f6 0,#edf1f6 1px,transparent 1px,transparent 25%)}
.comparison-column-bar{position:relative; display:block; width:100%; border-radius:3px 3px 0 0}
.comparison-column-value{position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
  padding-bottom:4px; font:700 11.5px/1.15 "IBM Plex Mono",monospace; white-space:nowrap; color:#123f8f}

const M=0,RG=1,EX=2,ST=3,CT=4,DT=5,GP=6,WK=7,QT=8,TX=9,SV=10;
/* built from the data, so a month added to the sheet needs no code change */
const FYI=11;                       /* every ledger row carries its financial year */
const SUPPLIER=12;                  /* Supplier Name from the sales register */
let FY=DATA.fy, MONTHS=[], SHORT={}, MS=[], YOF={};
function setFY(fy){                 /* switching year re-derives months and targets */
  FY=String(fy);
  MONTHS=(DATA.monthsByFY&&DATA.monthsByFY[FY])||DATA.months||[];
  SHORT=Object.fromEntries(MONTHS.map(m=>[m,m.split('-')[0]]));
  MS=MONTHS.map(m=>SHORT[m]);
  /* The calendar year a short month belongs to is not the financial year:
     'Apr' is 2026 but 'Jan' is 2027. Tooltips used to print a literal 2026,
     which was wrong for the last quarter and went stale on every rollover.
     Derived from the data so a new month needs no code change. */
  YOF=Object.fromEntries(MONTHS.map(m=>[SHORT[m], m.split('-')[1]||'']));
}
setFY(DATA.fy);
const fyRows=()=>DATA.rows.filter(r=>String(r[FYI])===FY);
const TG=()=>(DATA.targetsByFY&&DATA.targetsByFY[FY])||DATA.chanTargets||{};
const EXT=()=>(DATA.execByFY&&DATA.execByFY[FY])||[];
const fyName=()=>(DATA.fyLabels&&DATA.fyLabels[FY])||FY;
/* A later year with targets set in the Target planner but no sales yet. */
const isPlannedFY=()=>(DATA.plannedFys||[]).includes(String(FY));
const QTR=['Apr','May','Jun','Jul'];                 // Qtr-1 window used by the Power BI cards
const PROD=['Doctor Towel','Thirsty Towel'];
/* Chart colours are the report's own palette and stay as they are -- the red /
   black / white theme dresses the chrome, not the data. */
const C_BAR='#2f6fd0', C_BAR2='#123f8f', C_P1='#e8952c', C_P2='#17a2a0';
const C_DON=['#123f8f','#2a9d9c'];
const C_CHIP=['#1e3a8a','#2563eb','#0d9488','#7c3aed','#16a34a','#d97706'];

const PAGES=[
  {id:'home',    label:'Dashboard',     icon:'▤', title:'Dashboard'},
  {id:'online',  label:'Online Sales',  icon:'▣', title:'Online Sales'},
  {id:'team',    label:'Sales executive breakup', icon:'♙', title:'Sales executive breakup', hidden:true},
  {id:'saloon',  label:'Saloon',        icon:'✂', title:'Saloon Dashboard',  region:'Saloon',  tkey:'Saloon'},
  {id:'drs',     label:'D&R-S',         icon:'▣', title:'D&R-S Dashboard',   region:'D&R - S', tkey:'D&R-S', tfallback:'D&R - S TOTAL'},
  {id:'drn',     label:'D&R-N',         icon:'▤', title:'D&R-N Dashboard',   region:'D&R - N', tkey:'North'},
  {id:'llfo',    label:'L-LFO',         icon:'▥', title:'L-LFO Dashboard',   region:'L - LFO', tkey:'L-LFO', tfallback:'D&R - S TOTAL'},
  {id:'lfo',     label:'LFO',           icon:'▧', title:'LFO Dashboard',     region:'LFO',     tkey:'LFO Primary'},
  {id:'balance', label:'Target Balance', icon:'⚖', title:'Balance to Target'},
  {id:'state',   label:'State Details',  icon:'◬', title:'State Details'},
  {id:'store',   label:'Store Details',  icon:'⚑', title:'Store Details'},
  {id:'map',     label:'India Map',      icon:'◈', title:'Sales Across India'},
  {id:'yoy',     label:'Year on Year',   icon:'↗', title:'Year on Year'},
];
let page='home', homeView='overview';
const channelViews={};
const dashboardView=()=>page==='home'?homeView:(channelViews[page]||'overview');
// Values within one filter are a union; separate filters narrow that union.
// Accept scalar values too so existing links and saved integrations still work.
const filterValues=value=>[...new Set((Array.isArray(value)?value:[value]).filter(v=>v!=null&&v!==''&&v!=='All').map(String))];
const filterAll=value=>value==='All'||Array.isArray(value)&&value.includes('All')||filterValues(value).length===0;
const filterMatches=(value,item)=>filterAll(value)||filterValues(value).includes(String(item));
const filterLabel=(value,allLabel='All')=>filterAll(value)?allLabel:filterValues(value).join(', ');
const filterRead=select=>{const values=Array.from(select.selectedOptions,o=>o.value);return values.length&&!values.includes('All')?values:['All'];};
const filterTrim=(value,options)=>{const valid=filterValues(value).filter(v=>options.map(String).includes(v));return filterAll(value)||!valid.length?['All']:valid;};
const F={month:['All'], dtt:['All'], exec:['All'], dist:['All'], state:['All'], customer:['All']};
const LF={month:['All'], distributor:['All'], store:['All']};
const isLfoSecondary=()=>!!SECONDARY[page]&&dashboardView()==='secondary';

/* ---------- helpers ---------- */
const inr=n=>{n=Math.round(n);
  if(Math.abs(n)>=1e7) return '₹'+(n/1e7).toFixed(2)+' Cr';
  if(Math.abs(n)>=1e5) return '₹'+(n/1e5).toFixed(2)+' L';
  return '₹'+n.toLocaleString('en-IN');};
const inrF=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const cnt=n=>Math.round(n).toLocaleString('en-IN');
const kfmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':cnt(n);
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function niceMax(v){ if(v<=0)return 1;
  const mag=Math.pow(10,Math.floor(Math.log10(v))), s=v/mag;
  return (s<=1?1:s<=1.5?1.5:s<=2?2:s<=3?3:s<=4?4:s<=5?5:s<=7.5?7.5:10)*mag; }
const uniq=i=>[...new Set(fyRows().map(r=>r[i]).filter(v=>v&&v!=='Unknown'))].sort();

function pageDef(){ return PAGES.find(p=>p.id===page); }
function baseRows(){
  const d=pageDef(), reg=d.region;
  return fyRows().filter(r=>
    (!reg || r[RG]===reg) &&
    filterMatches(F.month,r[M]) &&
    filterMatches(F.dtt,r[DT]) &&
    filterMatches(F.exec,r[EX]) &&
    filterMatches(F.dist,r[GP]) &&
    filterMatches(F.state,r[ST])&&filterMatches(F.customer,r[12]));
}
const monthsSel=()=>MONTHS.filter(m=>filterMatches(F.month,m));
const shortSel=()=>monthsSel().map(m=>SHORT[m]);
const primaryPeriod=()=>filterAll(F.month)?(MONTHS.length?`${MONTHS.length} months (${SHORT[MONTHS[0]]}–${SHORT[MONTHS[MONTHS.length-1]]})`:'No billed months'):monthsSel().map(m=>m.replace('-',' ')).join(', ');
function tKey(d){ const k=d.tkey||'ALL TOTAL';
  return TG()[k] ? k : (d.tfallback||k); }
function tSum(key,ms){ const t=TG()[key]||{}; return ms.reduce((a,m)=>a+(t[m]||0),0); }
function tYear(key){ return Object.values(TG()[key]||{}).reduce((a,b)=>a+b,0); }

const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]');
  if(!t){tip.style.opacity=0;return;}
  tip.innerHTML=t.getAttribute('data-tip'); tip.style.opacity=1;
  tip.style.left=e.clientX+'px'; tip.style.top=(e.clientY-12)+'px';
});

const S=(w,h,cls)=>`<svg viewBox="0 0 ${w} ${h}" role="img"${cls?` class="${cls}"`:''}>`;
function barUp(x,y,w,h,r){ r=Math.min(r,w/2,h); if(h<=.5)return '';
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;}
function barRt(x,y,w,h,r){ r=Math.min(r,h/2,w); if(w<=.5)return '';
  return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`;}

/* ---------- visuals ---------- */
function vBar(rs,val,fmt,title){
  const ms=monthsSel();
  const d=ms.map(m=>{const s=rs.filter(r=>r[M]===m); return {l:SHORT[m], v:val(s), n:s.length};});
  const W=252,H=174,L=38,R=8,T=18,B=24,pw=W-L-R,ph=H-T-B;
  const max=niceMax(Math.max(1,...d.map(x=>x.v)));
  const bw=Math.min(58,pw/d.length*.5);
  let s=S(W,H);
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4,v=max*i/4;
    s+=`<line class="grid-l" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>`;
    s+=`<text class="tk" x="${L-6}" y="${y+4}" text-anchor="end">${i===0?'0':(fmt===cnt?cnt(v):tick(v))}</text>`;}
  d.forEach((x,i)=>{
    const cx=L+pw*(i+.5)/d.length,h=ph*(x.v/max),bx=cx-bw/2,by=T+ph-h;
    s+=`<path d="${barUp(bx,by,bw,h,3)}" fill="${C_BAR}" data-tip="${esc(`<b>${x.l} ${YOF[x.l]||''}</b><br>${title}: ${fmt(x.v)}<br>${cnt(x.n)} orders`)}"/>`;
    /* Counts stay as they are -- they are short already; only the currency
       labels need compacting, and the tooltip still carries the exact figure. */
    s+=`<text class="dl" x="${cx}" y="${by-7}" text-anchor="middle"
         style="font-size:9.5px">${fmt===cnt?cnt(x.v):dlab(x.v)}</text>`;
    s+=`<text class="tk" x="${cx}" y="${T+ph+17}" text-anchor="middle">${x.l}</text>`;});
  return s+`<line class="axis-l" x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}"/></svg>`;
}
function vLines(rs){
  const ms=monthsSel();
  const se=PROD.map((p,i)=>({n:p,c:i===0?C_P1:C_P2,
    v:ms.map(m=>rs.filter(r=>r[M]===m&&r[DT]===p).reduce((a,r)=>a+r[QT],0))}));
  const W=252,H=174,L=36,R=40,T=12,B=24,pw=W-L-R,ph=H-T-B;   // R holds the end labels
  const max=niceMax(Math.max(1,...se.flatMap(x=>x.v)));
  const xs=i=>ms.length===1?L+pw/2:L+pw*i/(ms.length-1), ys=v=>T+ph-ph*(v/max);
  let s=S(W,H);
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4,v=max*i/4;
    s+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#eef2f8"/>`;
    s+=`<text class="tk" x="${L-6}" y="${y+4}" text-anchor="end">${i===0?'0':kfmt(v)}</text>`;}
  ms.forEach((m,i)=>s+=`<text class="tk" x="${xs(i)}" y="${T+ph+17}" text-anchor="middle">${SHORT[m]}</text>`);
  ms.forEach((m,i)=>{const cw=pw/ms.length,x=ms.length===1?L:xs(i)-cw/2;
    s+=`<rect class="hit" x="${Math.max(L,x)}" y="${T}" width="${cw}" height="${ph}" data-tip="${esc(`<b>${SHORT[m]} ${YOF[SHORT[m]]||''}</b><br>`+se.map(e=>`${e.n} ${cnt(e.v[i])}`).join('<br>'))}"/>`;});
  se.forEach(e=>{
    if(ms.length>1) s+=`<path d="${e.v.map((v,i)=>`${i?'L':'M'}${xs(i)},${ys(v)}`).join(' ')}" fill="none" stroke="${e.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    e.v.forEach((v,i)=>s+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="4.2" fill="${e.c}" stroke="#fff" stroke-width="2"/>`);});
  const li=ms.length-1;
  const lb=se.map(e=>({y:ys(e.v[li]),t:kfmt(e.v[li]),c:e.c})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<lb.length;i++){const g=lb[i].y-lb[i-1].y; if(g<15){const p=(15-g)/2;lb[i-1].y-=p;lb[i].y+=p;}}
  lb.forEach(l=>s+=`<text class="dl" x="${xs(li)+8}" y="${l.y+4}" fill="${l.c}">${l.t}</text>`);
  return s+`<line class="axis-l" x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}"/></svg>`;
}
function vHBar(rs,key,n,label){
  const m=new Map();
  for(const r of rs){const k=r[key]; if(!k||k==='Unknown')continue;
    const o=m.get(k)||{o:0,v:0}; o.o++; o.v+=r[SV]; m.set(k,o);}
  const d=[...m.entries()].map(([k,v])=>({k,...v})).sort((a,b)=>b.o-a.o).slice(0,n);
  const W=252,rh=21,T=3,L=76,R=34,pw=W-L-R,H=Math.max(40,d.length*rh+T);
  const max=Math.max(1,...d.map(x=>x.o));
  let s=S(W,H);
  d.forEach((x,i)=>{const y=T+i*rh,w=pw*(x.o/max);
    const nm=x.k.length>14?x.k.slice(0,13)+'…':x.k;
    const url=key===ST?stateBreakdownUrl(x.k,{exact:true}):null;
    if(url)s+=`<a href="${esc(url)}" class="state-drilldown" aria-label="${esc(x.k)} customer sales breakdown for ${cnt(x.o)} orders">`;
    s+=`<text class="cl" x="${L-8}" y="${y+13}" text-anchor="end">${esc(nm)}</text>`;
    s+=`<path d="${barRt(L,y+3,w,15,3)}" fill="${C_BAR}" data-tip="${esc(`<b>${x.k}</b><br>${cnt(x.o)} orders<br>${inrF(x.v)}`)}"/>`;
    s+=`<text class="dl" x="${L+w+6}" y="${y+15}">${cnt(x.o)}</text>`;
    if(url)s+='</a>';});
  return d.length? s+'</svg>' : `<p class="note">No data for this selection.</p>`;
}
function vGauge(ach,tgt,sub){
  const p=tgt>0?ach/tgt*100:null, MAXP=150;
  const W=252,H=156,cx=W/2,cy=118,R=88,r=57;
  const ang=v=>Math.PI*(-1+Math.max(0,Math.min(v,MAXP))/MAXP);
  const arc=(a0,a1,c)=>{
    const pt=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
    const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r,a1),[x3,y3]=pt(r,a0);
    const big=(a1-a0)>Math.PI?1:0;
    return `<path d="M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3} Z" fill="${c}"/>`;};
  let s=S(W,H);
  s+=arc(ang(0),ang(50),'#e5544b')+arc(ang(50),ang(100),'#f0b429')+arc(ang(100),ang(MAXP),'#2fa360');
  /* short pointer sitting in the band, as the source report draws it */
  const a=ang(p||0);
  const nx0=cx+(r-14)*Math.cos(a), ny0=cy+(r-14)*Math.sin(a);
  const nx=cx+(R-5)*Math.cos(a),   ny=cy+(R-5)*Math.sin(a);
  s+=`<line x1="${nx0}" y1="${ny0}" x2="${nx}" y2="${ny}" stroke="#0f172a" stroke-width="3.4" stroke-linecap="round"/>`;
  s+=`<text x="${cx}" y="${cy-24}" text-anchor="middle" fill="#0f172a" style="font-size:26px;font-weight:700">${p===null?'N/A':Math.round(p)+'%'}</text>`;
  s+=`<text x="${cx}" y="${cy-9}" text-anchor="middle" class="tk" style="font-size:9px">Achievement</text>`;
  /* ticks sit at the band boundaries, the way the source report labels them */
  [[0,'0%'],[50,'50%'],[100,'100%'],[MAXP,MAXP+'%']].forEach(([v,t])=>{
    const aa=ang(v), rr=R+12, tx=cx+rr*Math.cos(aa), ty=cy+rr*Math.sin(aa)+4;
    const anc=v===0?'end':v===MAXP?'start':'middle';
    s+=`<text x="${tx}" y="${v===0||v===MAXP?ty+8:ty}" text-anchor="${anc}" class="tk">${t}</text>`;});
  s+='</svg>';
  return `<div class="gauge">${s}</div><div class="leg" style="margin:2px 0 0;gap:34px">
    <span style="flex-direction:column;gap:1px"><b style="color:var(--ink);font-size:14px">${inr(ach)}</b>
      <span style="color:var(--muted);font-size:11px">Achieved</span></span>
    <span style="flex-direction:column;gap:1px"><b style="color:var(--ink);font-size:14px">${tgt===null?'Not set':inr(tgt)}</b>
      <span style="color:var(--muted);font-size:11px">Target</span></span></div>${sub||''}`;
}

/* Months actually carrying billing, so a part-year gauge can say how far in we are. */
function billedMonths(){ return new Set(fyRows().map(r=>SHORT[r[M]])).size; }
function gaugeSub(qa,qt){
  const b=billedMonths();
  return `<p class="note" style="margin:6px 0 0;text-align:center">
    Qtr-1 (Apr&ndash;Jul) ${inr(qa)} / ${inr(qt)} &middot; ${pct(qa,qt)}%
    <br><span style="opacity:.8">${b} of 12 months billed &mdash; the full-year gauge reads low by design</span></p>`;
}

/* ---------- KPI cards ---------- */
/* One card. `foot` is either a plain caption or {lab,cur,prev} for a delta line
   computed against the previous month — never a made-up comparison. */
function kcard(icon,label,value,foot,ci,widget=dashboardCardKey(label)){
  if(!dashboardCan('widgets',widget))return '';
  const c=C_CHIP[ci%C_CHIP.length];
  let f='';
  if(foot && typeof foot==='object'){
    const {lab,cur,prev}=foot;
    if(prev>0){
      const g=(cur-prev)/prev*100, up=g>=0;
      f=`<div class="kfoot"><span>${esc(lab)}</span><span class="d ${up?'up':'down'}">${up?'&#9650;':'&#9660;'} ${Math.abs(g).toFixed(1)}%</span></div>`;
    }else f=`<div class="kfoot"><span>${esc(lab)}</span><span class="d">&ndash;</span></div>`;
  }else if(foot){ f=`<div class="kfoot"><span>${foot}</span></div>`; }
  return `<div class="kcard"><div class="ktop"><span class="kic" style="--c:${c}">${icon}</span>`+
         `<span class="lab">${label}</span></div><div class="val">${value}</div>${f}</div>`;
}
/* Previous-month comparison basis: only defined when a single month is picked. */
/* KPIs compare explicit month choices with those months' assigned targets.
   All months retains the full-year target context. */
function cards(rs,channelModel=null){
  return channelCards(rs,channelModel||channelTargetSelection());
}

/* ================= Sales Dashboard =================
   One page carrying every visual type in the reference report: KPI strip with
   month-over-month deltas, actual-vs-target trend line, doughnuts, horizontal
   bars, choropleth, ranked tables with contribution and delta columns, a bullet
   table, the gauge, a banded column chart and a derived alert list.
   Sales figures on this page are TAXABLE value, the basis the targets are set
   on; the with-tax total is shown on the first card.                        */
const C_ACT='#12356e', C_TGT='#9aa8bd', C_TEAL='#2a9d9c', C_BLUE='#2f6fd0',
      C_LT='#9dc0ec', C_OK='#22a35a', C_WARN='#f0b429', C_BAD='#e5544b';
const C_MIX=[C_ACT,C_TEAL,C_BLUE,C_LT,'#7c8db0','#c9d6e8'];

/* every filter except the month, so trends can always span the full window */
function rowsNoMonth(){
  const d=pageDef(), reg=d.region;
  return fyRows().filter(r=>
    (!reg || r[RG]===reg) &&
    filterMatches(F.dtt,r[DT]) &&
    filterMatches(F.exec,r[EX]) &&
    filterMatches(F.dist,r[GP]) &&
    filterMatches(F.state,r[ST])&&filterMatches(F.customer,r[12]));
}
const tick=n=>{n=Math.round(n);
  if(Math.abs(n)>=1e7) return (n/1e7).toFixed(Math.abs(n)>=1e8?0:1)+'Cr';
  if(Math.abs(n)>=1e5) return (n/1e5).toFixed(Math.abs(n)>=1e6?0:1)+'L';
  if(Math.abs(n)>=1000) return Math.round(n/1000)+'K';
  return String(n);};
/* Bar-top labels get only their own bar's slot to sit in. At six months that is
   about 34px, and inr()'s "₹2.46 L" is seven characters — roughly 46px — which
   is why neighbouring labels used to run into each other. Drop the symbol (the
   panel title already says ₹) and the space, keep two decimals so the figure is
   still exact enough to read off the chart. */
const dlab=n=>{n=Math.round(n);
  if(Math.abs(n)>=1e7) return (n/1e7).toFixed(2)+'Cr';
  if(Math.abs(n)>=1e5) return (n/1e5).toFixed(2)+'L';
  if(Math.abs(n)>=1000) return (n/1000).toFixed(1)+'K';
  return String(n);};
const sumTX=rs=>rs.reduce((a,r)=>a+r[TX],0);
const sumSV=rs=>rs.reduce((a,r)=>a+r[SV],0);
const sumQT=rs=>rs.reduce((a,r)=>a+r[QT],0);
const outlets=rs=>new Set(rs.map(r=>r[GP]+'␟'+r[CT])).size;

/* ---------- KPI strip ---------- */
function homeCards(rs,model=channelTargetSelection()){
  return channelCards(rs,model).replace('class="cards"','class="cards k6"');
}

/* ---------- actual vs target trend ---------- */
function vTrend(model=channelTargetSelection()){
  const rows=model.monthly.filter(row=>model.months.includes(row.month));
  if(!rows.length)return '<p class="note">No months available for this selection.</p>';
  const months=rows.map(row=>row.month),act=rows.map(row=>row.achieved),tg=rows.map(row=>row.target);
  const W=252,H=172,L=40,R=8,T=10,B=22,pw=W-L-R,ph=H-T-B;
  const max=niceMax(Math.max(1,...act,...tg));
  const xs=i=>months.length===1?L+pw/2:L+pw*i/(months.length-1), ys=v=>T+ph-ph*(v/max);
  let s=S(W,H);
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4,v=max*i/4;
    s+=`<line class="grid-l" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>`;
    s+=`<text class="tk" x="${L-6}" y="${y+4}" text-anchor="end">${i===0?'0':tick(v)}</text>`;}
  months.forEach((m,i)=>{
    s+=`<text class="tk" x="${xs(i)}" y="${T+ph+15}" text-anchor="middle">${SHORT[m]}</text>`;});
  months.forEach((m,i)=>{const cw=pw/months.length;
    s+=`<rect class="hit" x="${xs(i)-cw/2}" y="${T}" width="${cw}" height="${ph}" data-tip="${
      esc(`<b>${SHORT[m]} ${YOF[SHORT[m]]||''}</b><br>Actual ${inrF(act[i])}<br>Target ${tg[i]===null?'Not set':inrF(tg[i])}`+

  s+=`<line class="axis-l" x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}"/></svg>`;

/* ---------- doughnut with side legend ---------- */
function vRing(rs,idx,fmtv,unit){
  const m=new Map(), val=r=>unit==='qty'?r[QT]:unit==='count'?1:r[TX];
  for(const r of rs){const k=r[idx]||'Unknown'; m.set(k,(m.get(k)||0)+val(r));}
  return donut([...m.entries()].map(([k,v])=>({k,v})), fmtv);
}

/* The drawing half, taking slices that are already aggregated. Split out so a
   chart built from precomputed rows is the same picture as one built from raw
   ledger rows, rather than a near-copy that drifts. Zero slices stay in the
   legend on purpose -- a channel billing nothing is worth seeing. */
function donut(d,fmtv,cls){
  d=d.slice().sort((a,b)=>b.v-a.v);
  const tot=d.reduce((a,x)=>a+x.v,0);
  const W=210,H=210,cx=105,cy=105,R=86,r=56;
  let a0=-Math.PI/2, s=S(W,H);
  d.forEach((x,i)=>{
    if(!x.v) return;
    const share=x.v/Math.max(1,tot);
    /* an arc whose start and end coincide renders nothing, so a single category
       holding the whole total is drawn as a stroked circle instead */
    if(share>=0.9995){
      s+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none"
           stroke="${C_MIX[i%C_MIX.length]}" stroke-width="${R-r}"
           data-tip="${esc(`<b>${x.k}</b><br>${fmtv(x.v)} &middot; 100%`)}"/>`;
      a0+=2*Math.PI; return;}
    const a1=a0+2*Math.PI*share, big=(a1-a0)>Math.PI?1:0;
    const p=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
    const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);
    s+=`<path d="M${x0},${y0} A${R},${R} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big} 0 ${x3},${y3} Z"
         fill="${C_MIX[i%C_MIX.length]}" stroke="#fff" stroke-width="2"
         data-tip="${esc(`<b>${x.k}</b><br>${fmtv(x.v)} &middot; ${pct(x.v,tot)}%`)}"/>`;
    a0=a1;});
  s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#0f172a" style="font-size:21px;font-weight:700">${fmtv(tot)}</text>`;
  s+=`<text x="${cx}" y="${cy+18}" text-anchor="middle" class="tk">Total</text></svg>`;
  const leg=d.map((x,i)=>`<li><i class="sw" style="background:${C_MIX[i%C_MIX.length]}"></i>
    <span class="n">${esc(x.k)}</span><b>${fmtv(x.v)}</b><em>${pct(x.v,tot)}%</em></li>`).join('');
  return `<div class="dwrap${cls?' '+cls:''}">${s}<ul class="dlegend">${leg}</ul></div>`;
}

/* Names under the bars never break mid-word. In a landscape team chart they run
   across only while every name fits its column, otherwise that chart turns them
   upright. In the other charts a name wider than its column shrinks just enough
   to fit (down to 9px). Re-checked whenever a chart's width changes. */
let teamNameObserver=null;
function fitTeamNames(){
  teamNameObserver?.disconnect(); teamNameObserver=null;
  const charts=[...document.querySelectorAll('.comparison-chart')];
  const textWidth=el=>{const r=document.createRange(); r.selectNodeContents(el); return r.getBoundingClientRect().width;};
  const fit=chart=>{
    const names=[...chart.querySelectorAll('.comparison-name')];
    if(chart.classList.contains('comparison-team')){
      chart.classList.remove('names-vertical');
      if(!names.length||getComputedStyle(names[0]).writingMode!=='horizontal-tb')return;
      if(names.some(n=>n.offsetWidth>n.parentElement.clientWidth))chart.classList.add('names-vertical');
      return;
    }
    for(const n of names){
      n.style.fontSize='';
      let size=parseFloat(getComputedStyle(n).fontSize);
      while(size>9&&textWidth(n)>n.clientWidth){size-=.5; n.style.fontSize=size+'px';}
    }
  };
  charts.forEach(fit);
  if(charts.length&&typeof ResizeObserver!=='undefined'){
    teamNameObserver=new ResizeObserver(entries=>entries.forEach(e=>fit(e.target)));
    charts.forEach(c=>teamNameObserver.observe(c));
  }
}

  const bar=w=>compact?'':`<td style="width:70px"><span class="bul"><i style="width:${w}%"></i></span></td>`;
  const row=x=>`<tr><td>${esc(x.k)}</td><td class="n">${inr(x.v)}</td>
      ${bar((x.v/max*100).toFixed(1))}
      <td class="n">${x.t?inr(x.t):'&ndash;'}</td>
      <td class="n">${x.t?balCell(x.v-x.t):'&ndash;'}</td></tr>`;
  return `<div class="scroll"><table><thead><tr><th>Executive</th><th class="n">Sales</th>
    ${compact?'':'<th>&nbsp;</th>'}<th class="n">Target (year)</th><th class="n">Balance</th></tr></thead><tbody>
    ${d.map(row).join('')}
    ${rest.length?`<tr><td>Others (${rest.length})</td><td class="n">${inr(rv)}</td>
      ${bar((rv/max*100).toFixed(1))}
      <td class="n">${rt?inr(rt):'&ndash;'}</td>
      <td class="n">${rt?balCell(rv-rt):'&ndash;'}</td></tr>`:''}
    </tbody></table></div>${anyT?'':`<p class="note" style="text-align:left">No
      per-executive target exists for this selection.</p>`}`;
}

/* ---------- banded column chart ---------- */
const VB=[[0,10000,'Below 10K'],[10000,25000,'10K – 25K'],[25000,50000,'25K – 50K'],
          [50000,100000,'50K – 1L'],[100000,Infinity,'Above 1L']];
const VBC=['#2fa360','#8cbf3f','#f0b429','#ef8b3c','#e5544b'];
function vBands(rs){
  const d=VB.map(([lo,hi,l])=>{const sel=rs.filter(r=>r[TX]>=lo&&r[TX]<hi);
    return {l, n:sel.length, v:sumTX(sel)};});
  const W=252,H=176,L=36,R=6,T=16,B=32,pw=W-L-R,ph=H-T-B;
  const max=niceMax(Math.max(1,...d.map(x=>x.v)));
  const bw=Math.min(30,pw/d.length*.6);
  let s=S(W,H).replace('role="img"','role="group" aria-label="Order value bands — select a bar or amount to view sales breakups"');
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4,v=max*i/4;
    s+=`<line class="grid-l" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/>`;
    s+=`<text class="tk" x="${L-6}" y="${y+4}" text-anchor="end">${i===0?'0':tick(v)}</text>`;}
  d.forEach((x,i)=>{
    const cx=L+pw*(i+.5)/d.length, h=ph*(x.v/max), by=T+ph-h;
    const band=i===VB.length-1?'100000-plus':VB[i][0]+'-'+VB[i][1];
    s+=`<a class="achieved-drilldown" href="${esc(salesBreakdownUrl({value_band:band,return_view:'detail'}))}" aria-label="${esc(x.l)} sales ${esc(inrF(x.v))}. View sales breakups"><title>${esc(x.l)} — ${esc(inrF(x.v))} · ${cnt(x.n)} entries</title>`;
    s+=`<path d="${barUp(cx-bw/2,by,bw,h,3)}" fill="${VBC[i]}"
         data-tip="${esc(`<b>${x.l}</b><br>${cnt(x.n)} orders<br>${inrF(x.v)} taxable`)}"/>`;
    // Axis labels are shortened to fit each slot ("<10K", ">1L"); the tooltip keeps the full band.
    const axis=x.l.replace(' – ','–').replace(/^Below /,'<').replace(/^Above /,'>');
    s+=`<text class="dl" x="${cx}" y="${by-5}" text-anchor="middle" style="font-size:10.5px">${tick(x.v)}</text>`;
    s+=`<text class="tk" x="${cx}" y="${T+ph+13}" text-anchor="middle" style="font-size:9.5px">${axis}</text>`;
    s+=`<text class="tk" x="${cx}" y="${T+ph+25}" text-anchor="middle" style="font-size:9px" opacity=".85">${cnt(x.n)}</text></a>`;});
  return s+`<line class="axis-l" x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}"/></svg>`;
}

/* ---------- derived alerts (computed, not authored) ---------- */
function alertList(rs,model=channelTargetSelection()){
  const out=[], d=pageDef(), ms=shortSel();
  const comparison=dashboardTargetComparison(model),tx=comparison.achieved,yt=comparison.target,live=ms.length;
  const at=pct(tx,yt),pace=comparison.yearly?Math.round(live/12*100):100;
  /* Every alert names where its detail lives: `go` is a page id for the
     existing data-goto handler, `href` a real URL for the Sales team page,
     which is addressed by executive. */
  if(yt>0)out.push({sev:at>=pace?'ok':at>=pace*0.8?'warn':'bad',
    t:comparison.yearly?`${at}% of the full-year target after ${live} month${live===1?'':'s'} billed`:`${at}% of the target for ${live} selected month${live===1?'':'s'}`,
    d:`${inr(tx)} of ${inr(yt)}`+(comparison.yearly?` · an even pace would be ${pace}%`:''), go:'balance'});
  else out.push({sev:'warn',t:yt===0?'Selected target is zero':'Target not set for this selection',
    d:`${inr(tx)} achieved · achievement percentage is unavailable`});
  if(!d.region){
    const lag=CHKEY.map(([c,k])=>{
      const channel=channelTargetSelection(F,{region:c,tkey:k});
      const scope=dashboardTargetComparison(channel),t=scope.target,a=scope.achieved;
      return {c,a,t,p:t>0?a/t*100:null};}).filter(x=>x.p!==null).sort((a,b)=>a.p-b.p);
    const behind=lag.filter(x=>x.p<pace);
    if(behind.length) out.push({sev:'warn',
      t:`${behind.length} channel${behind.length>1?'s':''} ${comparison.yearly?"behind the year's pace":'below target for the selected months'}`,
      d:behind.slice(0,3).map(x=>`${x.c} ${Math.round(x.p)}%`).join(' · '), go:'balance'});
    if(lag.length&&lag[lag.length-1].p>=pace) {const b=lag[lag.length-1];
      out.push({sev:'ok',t:`${b.c} leads on attainment at ${Math.round(b.p)}%`,
        d:`${inr(b.a)} of ${inr(b.t)} ${comparison.yearly?'for the year':'for the selected months'}`,
        go:(PAGES.find(p=>p.region===b.c)||{}).id});}
  }
  const stm=new Map();
  for(const r of rs){const k=r[ST]; if(!k||k==='Unknown')continue; stm.set(k,(stm.get(k)||0)+r[TX]);}
  const top=[...stm.entries()].sort((a,b)=>b[1]-a[1])[0];
  if(top) out.push({sev:pct(top[1],tx)>=50?'warn':'ok',
    t:`${top[0]} carries ${pct(top[1],tx)}% of sales`,
    d:`${stm.size} states billing in the selected months`, go:'map'});
  const people=[...new Set((EXT()||[]).map(x=>x.person))].filter(person=>filterMatches(F.exec,person));
  const dead=people.map(person=>({person,model:channelTargetSelection({...F,exec:[person]})}))
    .filter(item=>item.model.selected.target>0&&item.model.selected.rows.length===0);
  /* One executive behind every silent target: open that person. Several: open
     the whole team, rather than pick one of them arbitrarily. */
  const deadPeople=[...new Set(dead.map(x=>x.person))];
  if(dead.length) out.push({sev:'bad',
    t:`${dead.length} executive target${dead.length>1?'s':''} with no billing in this selection`,
    d:dead.slice(0,3).map(x=>x.person).join(' · '),
    href:executiveDetailUrl(deadPeople.length===1?deadPeople[0]:'All'),
    label:deadPeople.length===1?`${deadPeople[0]}'s details`:'Sales team'});
  const ic={bad:'&#9888;',warn:'&#9679;',ok:'&#10004;'};
  return `<ul class="alist">${out.slice(0,4).map(a=>{
    const body=`<span class="ai">${ic[a.sev]}</span><div><b>${esc(a.t)}</b><em>${esc(a.d)}</em></div>`;
    /* A real button or link, not a clickable <li>, so Tab reaches it and
       Enter/Space open it with no extra key handling. */
    const where=a.label||(PAGES.find(p=>p.id===a.go)||{}).label;
    const open=esc(`${a.t}. Open ${where}`), more=`<span class="ago" aria-hidden="true">&#8250;</span>`;
    const inner=a.href?`<a class="alink" href="${esc(a.href)}" aria-label="${open}" title="Open ${esc(where)}">${body}${more}</a>`
               :a.go&&where?`<button type="button" class="alink" data-goto="${esc(a.go)}" aria-label="${open}" title="Open ${esc(where)}">${body}${more}</button>`
               :body;
    return `<li class="${a.sev}">${inner}</li>`;}).join('')}</ul>`;
}

/* ================= balance to target =================
   The gauge and the Ach % column answer "how close", which flatters a small
   target and punishes a big one — 90% of 4L and 90% of 8L read the same and are
   four lakhs apart. The balance answers "how much is still missing", in rupees,
   which is the number the target sheet is actually managed on.

   Sign convention throughout: achieved minus target, so negative is short. A
   month with no billing yet shows the whole target as the shortfall, which is
   what makes the year-to-go total add up. */

const balTxt = n => (n >= 0 ? '+' : '−') + inr(Math.abs(n));
/* the KPI-card form: whole rupees, signed, and coloured - short of
   target reads negative and red, ahead of it positive and green */
const balNum = n => `<span class="${n >= 0 ? 'up' : 'down'}">`+
  (n >= 0 ? '+' : '−') + inrF(Math.abs(n)) + '</span>';
const balCell = n => `<span class="${n >= 0 ? 'up' : 'down'}">${balTxt(n)}</span>`;

/* Balance follows the same selected population and target assignments. */
function gapByMonth(){
  const model=channelTargetSelection();
  return model.monthly.filter(row=>model.months.includes(row.month)).map(row=>
    ({month:row.month,m:row.month.split('-')[0],a:row.achieved,t:row.target,d:row.target===null?null:row.achieved-row.target}));
}

// Target Balance keeps full rupees in details and two-decimal lakhs on the bars.
const balanceMoney = value => '₹'+Number(value).toLocaleString('en-IN',{maximumFractionDigits:2});
const balanceSigned = value => (value>0?'+':value<0?'−':'')+balanceMoney(Math.abs(value));
const balanceCell = value => `<span class="${value>=0?'up':'down'}">${balanceSigned(value)}</span>`;
const balanceBarLabel = (value,signed=false) => (value<0?'−':signed&&value>0?'+':'')+
  (Math.abs(value)/1e5).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+' L';

function vGapBars(dimensions=null){
  const g=gapByMonth();
  if(!g.length)return '<p class="note">No months available for this selection.</p>';
  // Short lakh labels leave more room for the bars; tooltips retain full rupees.
  const labelRoom=Math.max(54,...g.filter(x=>x.d!==null).map(x=>balanceBarLabel(x.d,true).length*6.4+10));
  const W=dimensions?.width||600,H=dimensions?.height||230,L=52,R=16,T=labelRoom,B=26,pw=W-L-R,ph=H-T-B;
  const low=Math.min(0,...g.map(x=>x.d)),high=Math.max(0,...g.map(x=>x.d));
  const min=low<0?-niceMax(-low):0,max=high>0?niceMax(high):low<0?0:1;
  const y=value=>T+ph-(value-min)/(max-min)*ph,y0=y(0);
  const bw=Math.max(4,pw/g.length*.55),xs=i=>L+pw*(i+.5)/g.length;
  let s=S(W,H);
  for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,gy=y(v);
    s+=`<line class="grid-l" x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}"/>`;
    s+=`<text class="tk" x="${L-6}" y="${gy+4}" text-anchor="end">${v===0?'0':tick(v)}</text>`;}
  g.forEach((x,i)=>{
    if(x.d===null){
      s+=`<text class="tk" x="${xs(i)}" y="${y0-8}" text-anchor="middle"><title>${esc(x.m)} target not set</title>N/A</text>`;
    }else{
      const h=Math.abs(y(x.d)-y0),up=x.d>=0;
      const tip=`<b>${x.m} ${YOF[x.m]||''}</b><br>Achieved ${balanceMoney(x.a)}<br>Target ${balanceMoney(x.t)}<br>Balance ${balanceSigned(x.d)}`;
      s+=`<rect x="${(xs(i)-bw/2).toFixed(1)}" y="${(up?y0-h:y0).toFixed(1)}"
        width="${bw.toFixed(1)}" height="${Math.max(h,.8).toFixed(1)}" rx="1.5"
        fill="${up?C_OK:C_BAD}" data-tip="${esc(tip)}"/>`;
      // Keep negative labels above the baseline so they remain inside the chart.
      const labelY=(up?y0-h:y0)-7;
      s+=`<text class="dl gap-end-label" transform="translate(${xs(i)},${labelY.toFixed(1)}) rotate(-90)" text-anchor="start"
        style="font-size:10.5px;font-weight:800;fill:${up?'#087443':'#b42318'};pointer-events:none"
        aria-label="${esc(x.m+' balance '+balanceSigned(x.d))}">${balanceBarLabel(x.d,true)}</text>`;
    }
    s+=`<text class="tk gap-month-label" x="${xs(i)}" y="${H-8}" text-anchor="middle">${x.m}</text>`;
  });
  s+=`<line class="axis-l" x1="${L}" y1="${y0}" x2="${W-R}" y2="${y0}"/></svg>`;
  return `<div class="leg"><span><i class="sw" style="background:${C_BAD}"></i>Short</span>
    <span><i class="sw" style="background:${C_OK}"></i>Ahead</span></div>${s}`;
}

/* Target beside achieved, month by month. Says something the balance chart
   cannot: how much of each month's bar actually got filled. Months not yet
   billed show the target bar alone rather than a zero-height stub. */
const C_BAL_T='#9aa8bd', C_BAL_A='#e8952c';
/* Home and channels share one assignment model with their cards and gauge. */
function vTgtBars(compact,selectedMonths=false,withDetails=false,channelModel=null,dimensions=null,exactAmounts=false){
  const model=channelModel||channelTargetSelection();
  const source=model?model.monthly.filter(row=>MONTHS.includes(row.month)).map(row=>
    ({...row,m:row.month.split('-')[0],a:row.achieved,t:row.target,d:row.target===null?null:row.achieved-row.target})):
    gapByMonth().map((row,i)=>({...row,month:MONTHS[i]}));
  const g=source
    .filter(row=>!selectedMonths||filterMatches(F.month,row.month));
  if(!g.length)return '<p class="note">No months available for this selection.</p>';
  const showTarget=model.hasTargets;
  const targetLabel=model?(model.executiveFiltered?'Executive target':'Target'):
    selectedMonths&&['dtt','exec','dist','state','customer'].some(k=>!filterAll(F[k]))?'Company target':'Target';
  const amount=exactAmounts?balanceMoney:inrF;
  const tv=!!dimensions?.tv;
  const tvFont=tv?Math.max(11,Math.min(16,dimensions.width/52)):0;
  const labelRoom=exactAmounts?Math.max(54,...g.flatMap(x=>[x.t,x.a]).filter(v=>v!==null).map(v=>balanceBarLabel(v).length*6.4+10)):0;
  const W=dimensions?.width||(exactAmounts?600:compact?252:withDetails?360:selectedMonths?560:740),
        H=dimensions?.height||(exactAmounts?230:compact?178:214), L=tv?Math.max(40,tvFont*3.8):compact||selectedMonths?40:52,
        R=compact?8:16, T=exactAmounts?labelRoom:tv?tvFont*3.5:compact?34:38, B=exactAmounts?40:tv?60:dimensions?60:(compact?24:26)+(model?17:0);
  const pw=W-L-R, ph=H-T-B;
  const max=niceMax(Math.max(1,...g.flatMap(x=>[x.t,x.a])));
  const low=model&&g.some(x=>x.a<0)?-niceMax(Math.max(...g.map(x=>-x.a))):0;
  const y=value=>T+ph-(value-low)/(max-low)*ph,zero=y(0);
  const slot=pw/g.length, bw=Math.min(compact?7:tv?40:dimensions?28:16,slot*0.34);
  let s=S(W,H).replace('role="img"','role="group" aria-label="Monthly target and achieved sales"');
  for(let i=0;i<=4;i++){const gy=T+ph-ph*i/4,v=low+(max-low)*i/4;
    s+=`<line class="grid-l" x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}"/>`;
    s+=`<text class="tk" x="${L-6}" y="${gy+4}" text-anchor="end"${tv?` style="font-size:${tvFont}px"`:''}>${tick(v)}</text>`;}
  g.forEach((x,i)=>{
    const cx=L+slot*(i+0.5);
    if(showTarget&&model&&x.t===null)s+=`<text class="tk" x="${cx-bw/2-1}" y="${zero-5}" text-anchor="middle"><title>${esc(x.month)} target not set or incomplete</title>—</text>`;
    else if(model&&x.t===0)s+=`<text class="tk" x="${cx-bw/2-1}" y="${zero-5}" text-anchor="middle"><title>${esc(x.month)} target ₹0</title>${exactAmounts?'0.00 L':'0'}</text>`;
    [[x.t,C_BAL_T,targetLabel,cx-bw-1],[x.a,C_BAL_A,'Achieved',cx+1]].forEach(([v,c,lab,bx])=>{
      if(v===null||v===0&&!(lab==='Achieved'&&model&&x.achievedRows.length)||v<0&&!model) return;
      const h=Math.max(.8,Math.abs(y(v)-zero)),by=Math.min(zero,y(v));
      if(lab==='Achieved')s+=`<a class="achieved-drilldown" href="${esc(model?channelTargetBreakdownUrl(model,x,{month:[x.month]}):salesBreakdownUrl({month:[x.month]}))}" aria-label="${esc(x.month)} achieved ${esc(amount(v))}. View sales breakups"><title>View ${esc(x.month)} sales breakups</title>`;
      s+=`<path d="${barUp(bx,by,bw,h,2)}" fill="${c}" data-tip="${esc(
        `<b>${x.m} ${YOF[x.m]||''}</b><br>${lab} ${amount(v)}`+
        (x.t?`<br>${x.a>=x.t?'Ahead by ':'Short by '}${amount(Math.abs(x.d))}`:''))}"/>`;
      /* turned upright: twelve months of paired bars leaves no width to write a
         value across, and a number you cannot read is worse than a tooltip */
      s+=`<text class="dl" transform="translate(${bx+bw/2},${v<0&&!exactAmounts?y(v)+5:by-5}) rotate(-90)"
        text-anchor="${v<0&&!exactAmounts?'end':'start'}" style="font-size:${tv?tvFont:compact?8.5:withDetails?12:10.5}px;fill:${
          c===C_BAL_T?'#8492a8':'#12356e'}">${exactAmounts?balanceBarLabel(v):tick(v)}</text>`;
      if(lab==='Achieved')s+='</a>';});
    s+=`<text class="tk monthly-target-month" x="${cx}" y="${T+ph+(tv?22:15)}" text-anchor="middle"${tv?` style="font-size:${tvFont}px"`:''}>${x.m}</text>`;
    if(model){
      const percent=x.t>0?(x.a/x.t*100).toFixed(1).replace(/\.0$/,'')+'%':'N/A';
      const explanation=x.t===null?'Target not set or incomplete':x.t===0?'Target is zero; percentage is not applicable':
        `Achieved ${amount(x.a)} / target ${amount(x.t)}`;
      s+=`<text class="tk monthly-achievement" data-month="${esc(x.month)}" x="${cx}" y="${T+ph+(tv?42:30)}" text-anchor="middle"
        style="font-size:${tv?tvFont-1:compact?9:10}px;font-weight:700" aria-label="${esc(x.month+' achievement '+percent+'. '+explanation)}">${percent}<title>${esc(explanation)}</title></text>`;
    }
  });
  s+=`<line class="axis-l" x1="${L}" y1="${zero}" x2="${W-R}" y2="${zero}"/></svg>`;
  return `<div class="leg"${model.targetNote?` title="${esc(model.targetNote)}"`:''}>${showTarget?`<span><i class="sw" style="background:${C_BAL_T}"></i>${targetLabel}</span>`:''}
    <span><i class="sw" style="background:${C_BAL_A}"></i>Achieved</span></div>${s}`;
}

/* Match the monthly drawing to its card in the restricted two-chart layout.
   Recompute bar coordinates instead of stretching SVG text or leaving a
   shallow, fixed-aspect drawing in the middle of a tall card. */
let dashboardMonthObserver=null;
let balanceChartObserver=null;
function fitBalanceCharts(){
  const charts=[...document.querySelectorAll('#page .balance-exact-chart')];
  if(!charts.length)return;
  const model=channelTargetSelection(),sizes=new WeakMap();
  const draw=chart=>{
    if(!chart.isConnected)return;
    const svg=chart.querySelector('svg');if(!svg)return;
    const box=svg.getBoundingClientRect(),width=Math.floor(box.width),height=Math.floor(box.height);
    if(width<120||height<150)return;
    const size=width+'x'+height;if(sizes.get(chart)===size)return;
    sizes.set(chart,size);
    chart.innerHTML=dashboardMarkup(chart.dataset.balanceChart==='target'?
      vTgtBars(false,true,false,model,{width,height},true):vGapBars({width,height}));
  };
  charts.forEach(draw);
  if(typeof ResizeObserver!=='undefined'){
    balanceChartObserver=new ResizeObserver(entries=>entries.forEach(entry=>draw(entry.target)));
    charts.forEach(chart=>balanceChartObserver.observe(chart));
  }
}
function fitDashboardMonthChart(){
  const chart=document.querySelector('#page .dashboard-two-charts .mom-chart');
  if(!chart?.querySelector('svg'))return;
  const model=channelTargetSelection();
  let lastSize='';
  const draw=()=>{
    if(!chart.isConnected)return;
    const svg=chart.querySelector('svg');
    if(!svg)return;
    const box=svg.getBoundingClientRect(),width=Math.floor(box.width),height=Math.floor(box.height);
    if(width<120||height<120)return;
    const size=width+'x'+height;
    if(size===lastSize)return;
    lastSize=size;
    const focused=chart.contains(document.activeElement)?document.activeElement.closest('a')?.getAttribute('href'):null;
    chart.innerHTML=dashboardMarkup(vTgtBars(false,true,false,model,{width,height,tv:document.body.classList.contains('salesviewer-tv')}));
    if(focused)[...chart.querySelectorAll('a[href]')].find(link=>link.getAttribute('href')===focused)?.focus({preventScroll:true});
  };
  draw();
  if(typeof ResizeObserver!=='undefined'){
    dashboardMonthObserver=new ResizeObserver(draw);
    dashboardMonthObserver.observe(chart);
  }
}

/* Month rows and totals use the same selected period and exact currency. */
function tblGapMonth(){
  const g=gapByMonth(),model=channelTargetSelection(),tt=model.selected.target,ta=model.selected.achieved;
  const row=x=>`<tr><td>${x.m}</td><td class="n">${x.t===null?'Not set':balanceMoney(x.t)}</td>
    <td class="n">${balanceMoney(x.a)}</td>
    <td class="n">${x.d===null?'N/A':balanceCell(x.d)}</td></tr>`;
  return `<div class="scroll"><table><thead><tr><th>Month</th>
    <th class="n">Target</th><th class="n">Achieved</th><th class="n">Balance</th></tr></thead><tbody>
    ${g.map(row).join('')}
    <tr class="tot"><td>Selected total</td><td class="n">${tt===null?'Not set':balanceMoney(tt)}</td>
      <td class="n">${balanceMoney(ta)}</td>
      <td class="n">${tt===null?'N/A':balanceCell(ta-tt)}</td></tr>
    </tbody></table></div>${tt!==null?'':
    `<p class="note" style="text-align:left">No channel target is set for this
      selection, so there is nothing to balance against.</p>`}`;
}

/* The same measure per channel. Region label on the left, target key on the
   right -- they differ in the workbook and always have. */
function tblGapChannel(){
  const model=channelTargetSelection();
  const CH=[...CHKEY,...[...new Set(model.selected.rows.map(row=>row[RG]))]
    .filter(region=>!CHKEY.some(([known])=>known===region)).map(region=>[region,null])];
  const d=CH.map(([region,key])=>{

function homeComparisonModel(){
  const calendar=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const selected=monthsSel(),region=pageDef().region;
  const historicalFiltered=!!region||['dtt','exec','dist','state','customer'].some(k=>!filterAll(F[k]));
  const ledgerYears=new Set(),recorded=new Set(),amounts=new Map();
  for(const r of DATA.rows){
    const fy=String(r[FYI]),key=fy+'|'+r[M];
    ledgerYears.add(fy);recorded.add(key);
    if((!region||r[RG]===region)&&filterMatches(F.dtt,r[DT])&&filterMatches(F.exec,r[EX])&&
       filterMatches(F.dist,r[GP])&&filterMatches(F.state,r[ST])&&filterMatches(F.customer,r[12]))amounts.set(key,(amounts.get(key)||0)+r[TX]);
  }
  const history=new Map();
  // The owner confirmed these two legacy summary years on 03 Oct 2026.
  // Explicit source labels override the confirmed mapping when the summary is updated.
  ['y2425','y2526'].forEach((field,i)=>{
    const label=(DATA.histLabels||[])[i],match=String(label||'').match(/^(\d{4})\s*[-/]\s*\d{2,4}$/);
    const year=label==null||label===''?String(2024+i):match?.[1];
    if(!year)return;
    for(const row of DATA.hist||[]){
      const value=row[field];
      if(typeof value==='number'&&Number.isFinite(value))history.set(year+'|'+row.m,value);
    }
  });
  const monthFor=(fy,short)=>short+'-'+(Number(fy)+(calendar.indexOf(short)<3?1:0));
  const valueFor=(fy,month)=>{
    const key=String(fy)+'|'+month;
    if(ledgerYears.has(String(fy)))return recorded.has(key)?(amounts.get(key)||0):null;
    if(historicalFiltered)return null;
    return history.get(String(fy)+'|'+month.split('-')[0])??null;
  };
  const delta=(actual,previous)=>({change:actual===null||previous===null?null:actual-previous,
    percent:actual===null||previous===null||previous<=0?null:(actual-previous)/previous*100});
  const months=selected.map(month=>{
    const [short,year]=month.split('-'),index=calendar.indexOf(short);
    const previousMonth=calendar[(index+11)%12]+'-'+(Number(year)-(index===0?1:0));
    const priorFY=Number(FY)-(short==='Apr'?1:0);
    const actual=valueFor(FY,month),previous=valueFor(priorFY,previousMonth);
    return {month,previousMonth,actual,previous,...delta(actual,previous)};
  });
  const totalFor=fy=>{
    const values=selected.map(m=>valueFor(fy,monthFor(fy,m.split('-')[0])));
    const availableMonths=values.filter(v=>v!==null).length;
    return {actual:values.length&&availableMonths===values.length?values.reduce((a,b)=>a+b,0):null,
      availableMonths,totalMonths:values.length};
  };
  const years=[Number(FY)-2,Number(FY)-1,Number(FY)].map(fy=>{
    const current=totalFor(fy),previous=totalFor(fy-1).actual;
    return {fy:String(fy),label:String(fy)+'-'+String(fy+1).slice(-2),...current,previous,...delta(current.actual,previous)};
  });
  const comparisons=selected.map(month=>({m:month.split('-')[0],
    a:valueFor(Number(FY)-2,monthFor(Number(FY)-2,month.split('-')[0])),
    b:valueFor(Number(FY)-1,monthFor(Number(FY)-1,month.split('-')[0])),c:valueFor(FY,month)}));
  return {months,years,historicalFiltered,total:totalFor(FY).actual,comparisons};
}

function fitLfoCharts(){

    const spec=lfoChartSpecs[Number(plot.dataset.lfoPlot)];

    const focused=plot.contains(document.activeElement)?document.activeElement.dataset.secondaryBreakdown:undefined;
    plot.innerHTML=lfoPlot(spec.rows,spec.monthly,spec.yearly,width,height);
    if(focused!==undefined)plot.querySelector(`[data-secondary-breakdown="${focused}"]`)?.focus({preventScroll:true});
  };
  for(const plot of plots)draw(plot,plot.clientWidth,plot.clientHeight);

    lfoChartObserver=new ResizeObserver(entries=>{

  }
}

/* Executive targets retain their assigned channel/geography and actual month

function execTarget(person,yearly){

/* ---------- cities ----------
   Names are matched on letters and digits alone, so spacing and punctuation
   differences between the tabs do not matter. Spelling still has to agree. */
const rkey=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function cityTarget(city){
  const region=pageDef().region;
  if(['dtt','dist','state','customer'].some(key=>!filterAll(F[key])))return null;
  const people=[...new Set(EXT().filter(plan=>filterMatches(F.exec,plan.person)).map(plan=>plan.person))];
  const allocations=people.flatMap(person=>executiveTargetAllocations(person)).filter(allocation=>
    allocation.scopeType==='city'&&(!region||allocation.region===region)&&rkey(allocation.city)===rkey(city));
  return executiveAllocationTarget(allocations,monthsSel());
}
/* Every city in the rows handed to it - used by the channel pages for their own
   billing, and by State Details for the lot. */
function tblCities(rs,n,note,salesShare=false){
  const m=new Map();
  for(const r of rs){
    /* the ledger writes a missing city as the literal 'Unknown' */
    const raw=(r[CT]||'').trim();
    const k=(!raw||raw==='Unknown')?'(no city on the invoice)':raw;
    const o=m.get(k)||{o:0,tx:0,st:new Set(),suppliers:new Set()};
    o.o++; o.tx+=r[TX]; if(r[ST]&&r[ST]!=='Unknown') o.st.add(r[ST]);
    const supplier=(r[SUPPLIER]||'').trim().replace(/\s+/g,' ').toLowerCase();
    if(supplier&&supplier!=='unknown')o.suppliers.add(supplier);
    m.set(k,o);
  }
  const all=[...m.entries()].map(([k,v])=>({k,...v,t:salesShare||k.charAt(0)==='('?null:cityTarget(k)}))
    .sort((a,b)=>b.tx-a.tx);
  const d=all.slice(0,n), rest=all.slice(n);
  const rv=rest.reduce((a,x)=>a+x.tx,0), ro=rest.reduce((a,x)=>a+x.o,0);
  const tot=all.reduce((a,x)=>a+x.tx,0), to=all.reduce((a,x)=>a+x.o,0);
  // Totals count a supplier once even when it bills in multiple cities.
  const supplierCount=cities=>new Set(cities.flatMap(x=>[...x.suppliers])).size;
  // The denominator covers all filtered cities, including the Others bucket.
  const share=value=>tot>0?(value/tot*100).toFixed(1)+'%':'&ndash;';
  const row=x=>`<tr><td>${esc(x.k)}</td><td>${esc([...x.st].sort().join(', ')||'&ndash;')}</td>
    ${salesShare?`<td class="n">${cnt(x.suppliers.size)}</td>`:''}
    <td class="n">${cnt(x.o)}</td><td class="n">${inr(x.tx)}</td>
    ${salesShare?`<td class="n">${share(x.tx)}</td>`:`<td class="n">${x.t===null?'Not set':inr(x.t)}</td>
    <td class="n">${x.t>0?`<span class="${x.tx>=x.t?'up':'down'}">${pct(x.tx,x.t)}%</span>`:'N/A'}</td>`}</tr>`;
  return `<div class="scroll"><table><thead><tr><th>City</th><th>State</th>
    ${salesShare?'<th class="n" title="Distinct Supplier Names billed in this city and channel for the selected filters; repeated names count once">Suppliers</th>':''}
    <th class="n">Orders</th><th class="n">Taxable</th>
    ${salesShare?'<th class="n" title="City taxable sales as a percentage of total city sales for the selected filters">Sales %</th>':'<th class="n">Selected target</th><th class="n">%</th>'}</tr></thead><tbody>
    ${d.map(row).join('')}
    ${rest.length?`<tr><td>Others (${rest.length})</td><td>&ndash;</td>
      ${salesShare?`<td class="n" title="Distinct suppliers across the remaining cities">${cnt(supplierCount(rest))}</td>`:''}
      <td class="n">${cnt(ro)}</td><td class="n">${inr(rv)}</td>
      ${salesShare?`<td class="n">${share(rv)}</td>`:'<td class="n">&ndash;</td><td class="n">&ndash;</td>'}</tr>`:''}
    <tr class="tot"><td>Total</td><td></td>
      ${salesShare?`<td class="n" title="Distinct suppliers across all filtered cities; the same name counts once even across multiple cities">${cnt(supplierCount(all))}</td>`:''}
      <td class="n">${cnt(to)}</td>
      <td class="n">${inr(tot)}</td>${salesShare?`<td class="n">${share(tot)}</td>`:'<td class="n">&ndash;</td><td class="n">&ndash;</td>'}</tr>
    </tbody></table></div>${note?`<p class="note">${note}</p>`:''}`;
}

function secondaryChart(){

  const W=252,H=176,LM=38,R=6,T=14,B=24,pw=W-LM-R,ph=H-T-B;
  const max=niceMax(Math.max(1,...L.flatMap(x=>[x.stgt,x.sach])));
  const bw=Math.min(9,pw/L.length*0.34);
  let ch=S(W,H);
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4,v=max*i/4;
    ch+=`<line class="grid-l" x1="${LM}" y1="${y}" x2="${W-R}" y2="${y}"/>`;
    ch+=`<text class="tk" x="${LM-6}" y="${y+4}" text-anchor="end">${i===0?'0':tick(v)}</text>`;}
  L.forEach((x,i)=>{
    const cx=LM+pw*(i+0.5)/L.length;

    ch+=`<path d="${barUp(cx-bw-.5,T+ph-ht,bw,ht,2)}" fill="#9fb2c9" data-tip="${esc('<b>'+x.m+'</b><br>Secondary target '+inrF(x.stgt))}"/>`;
    if(x.sach>0) ch+=`<path d="${barUp(cx+.5,T+ph-ha,bw,ha,2)}" fill="#e8952c" data-tip="${esc('<b>'+x.m+'</b><br>Secondary achieved '+inrF(x.sach)+'<br>'+pct(x.sach,x.stgt)+'% of target')}"/>`;
    if(i%2===0) ch+=`<text class="tk" x="${cx}" y="${T+ph+13}" text-anchor="middle" style="font-size:9.5px">${x.m}</text>`;});

/* Three financial years of monthly taxable sales. Split out of pgYoy so the
   Dashboard can show the same chart without a second, drifting copy of the
   arithmetic. Returns null when the supplementary workbook carried no prior
   years, leaving each caller to say so in its own way. */
function yoySeries(){
  const comparison=homeComparisonModel(),rows=comparison.comparisons;
  if(!rows.length||rows.every(row=>[row.a,row.b,row.c].every(value=>value===null)))return null;
  const [L1,L2,L3]=comparison.years.map(year=>year.label);
  return {rows, L1, L2, L3,historicalFiltered:comparison.historicalFiltered,
          se:[{n:L1,c:'#94a3b8',v:rows.map(r=>r.a)},
              {n:L2,c:'#e8952c',v:rows.map(r=>r.b)},
              {n:L3,c:'#123f8f',v:rows.map(r=>r.c)}]};
}

/* Legend plus the line chart, ready to drop into a panel at any width -- the
   viewBox scales, so the same markup serves the full-width panel on the Year on
   Year page and the third-width one on the Dashboard. */
/* W/Ht set the drawing's proportions: the wide default for a double panel, a
   narrower one (Dashboard Detail) so its text is not scaled down to fit. */
function vYoyLines(y,W=740,Ht=214){
  const {rows,se,L1,L2,L3}=y;
  const narrow=W<500,LM=narrow?40:52,R=narrow?10:30,T=14,B=26,pw=W-LM-R,ph=Ht-T-B;
  const max=niceMax(Math.max(1,...se.flatMap(x=>x.v)));
  const xs=i=>rows.length===1?LM+pw/2:LM+pw*i/(rows.length-1), ys=v=>T+ph-ph*(v/max);
  let ch=S(W,Ht);
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4,v=max*i/4;
    ch+=`<line class="grid-l" x1="${LM}" y1="${y}" x2="${W-R}" y2="${y}"/>`;
    ch+=`<text class="tk" x="${LM-6}" y="${y+4}" text-anchor="end">${i===0?'0':tick(v)}</text>`;}
  rows.forEach((r,i)=>{ch+=`<text class="tk" x="${xs(i)}" y="${T+ph+14}" text-anchor="middle">${r.m}</text>`;});
  rows.forEach((r,i)=>{const cw=pw/rows.length;
    const amount=value=>value===null?'Unavailable':inrF(value);
    ch+=`<rect class="hit" x="${xs(i)-cw/2}" y="${T}" width="${cw}" height="${ph}" data-tip="${esc('<b>'+r.m+'</b><br>'+L1+' '+amount(r.a)+'<br>'+L2+' '+amount(r.b)+'<br>'+L3+' '+amount(r.c))}"/>`;});
  se.forEach(e=>{
    const path=e.v.map((v,i)=>v===null?'':`${i&&e.v[i-1]!==null?'L':'M'}${xs(i)},${ys(v)}`).join(' ');
    if(path.trim())ch+=`<path d="${path}" fill="none" stroke="${e.c}" stroke-width="2" stroke-linejoin="round"/>`;
    e.v.forEach((value,i)=>{if(value!==null)ch+=`<circle cx="${xs(i)}" cy="${ys(value)}" r="3" fill="${e.c}" stroke="#fff" stroke-width="1.6"/>`;});});
  ch+=`<line class="axis-l" x1="${LM}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}"/></svg>`;
  return `<div class="leg">${se.map(e=>`<span><i class="sw" style="background:${e.c}"></i>${esc(e.n)}</span>`).join('')}</div>
    <div class="fill">${ch}</div>${y.historicalFiltered?'<p class="note">Prior-year data is unavailable where the saved summary has no matching filter breakdown.</p>':''}`;
}
